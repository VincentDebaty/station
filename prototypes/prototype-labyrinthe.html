<style>
/* ------------------------------------------------------------------
   LABYRINTHE D'EAU — prototype jouable d'un puzzle d'eau, hors de Station.

   Une boule flotte dans un labyrinthe vu en coupe. Trois vannes : le
   robinet verse une unité d'eau par tape, les vidanges en retirent une ;
   un appui long verse ou vide en continu. L'eau coule pour de vrai, case
   à case, et la boule suit son courant. En remplissant et en vidant, on
   mène la boule jusqu'à la sortie.

   Trois blocs : le niveau (JSON), le moteur (pur, sans DOM — le banc
   tools/labyrinthe-banc.mjs l'extrait et le joue sans navigateur), la vue.
   ------------------------------------------------------------------ */
:root {
  color-scheme: light;
  --fond: #33278a;
  --texte: #f4f1ff;
  --doux: #b9b0ec;
  --carte: #fffaf0;
  --encre: #2a2350;
  --or: #ffc93c;
  --vert: #3fae5b;
  --f-titre: "Fredoka", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden; background: var(--fond); color: var(--texte);
  font: 15px/1.4 var(--f-titre);
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  display: flex; flex-direction: column;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
}
button { font: inherit; color: inherit; cursor: pointer; border: 0; }
button:focus-visible { outline: 3px solid var(--or); outline-offset: 2px; }
[hidden] { display: none !important; }

#barre { display: flex; align-items: center; gap: 10px; padding: 12px 16px 4px; }
.rond {
  width: 52px; height: 52px; border-radius: 16px; flex: none;
  background: #7b5cf0; box-shadow: inset 0 -5px 0 #5a3fc9, 0 3px 0 #251c66;
  display: grid; place-items: center;
}
.rond:active { transform: translateY(2px); box-shadow: inset 0 -3px 0 #5a3fc9, 0 1px 0 #251c66; }
.rond:disabled { opacity: .45; }
.rond svg { width: 28px; height: 28px; }
#titre {
  flex: 1; text-align: center; background: #241b6b; border-radius: 999px; padding: 8px 14px;
  font-weight: 600; font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
#titre b { color: var(--or); font-weight: 700; }
#infos { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 6px 20px 0; color: var(--doux); font-size: 14px; }
#tapes { white-space: nowrap; }
#tapes b { color: var(--texte); }
#scene { flex: 1; width: 100%; min-height: 0; display: block; touch-action: manipulation; }
.cible { cursor: pointer; }

.voile { position: fixed; inset: 0; display: grid; place-items: center; padding: 20px; background: rgba(20, 14, 60, .55); }
.carte {
  width: min(340px, 100%); background: var(--carte); color: var(--encre); border-radius: 22px;
  padding: 22px 20px 18px; text-align: center; box-shadow: 0 6px 0 #1c1550;
}
.carte h2 { margin: 0 0 6px; font-size: 24px; font-weight: 700; }
.carte p { margin: 0 0 16px; color: #5b5480; }
.boutons { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.bouton {
  min-height: 48px; padding: 0 20px; border-radius: 14px; font-weight: 600; font-size: 17px;
  background: #7b5cf0; color: #fff; box-shadow: inset 0 -4px 0 #5a3fc9;
}
.bouton.vert { background: var(--vert); box-shadow: inset 0 -4px 0 #2d8545; }

<!-- ------------------------------------------------------------------
     LE NIVEAU. La grille se lit comme elle se voit, rangée du haut d'abord :
       #  mur          .  vide          S  sortie (au bord)
       o  la boule     ~  eau de départ
       1…9  une vanne, dont le type est dans « vannes » (dans l'ordre) ;
            un robinet au bord gauche, droit ou haut a son bouton dehors
     « eau » : niveau de départ — toute case ouverte sous cette rangée
     (comptée depuis le bas, 0 = la rangée du bas) est pleine.
     « solution » : une suite de tapes qui gagne (chiffre = vanne) ; « par »
     sa longueur ; « pieges » : des suites qui NE doivent PAS gagner. Le banc
     vérifie les trois, et cherche une solution plus courte que le par.
     ------------------------------------------------------------------ -->
<script type="application/json" id="niveau">
{
  "titre": "Les deux étages",
  "conseil": "Le robinet remplit, les vidanges vident (appui long : en continu). La boule suit le courant.",
  "par": 21,
  "solution": "331111111111111111111",
  "pieges": ["111111111111111111111111111111"],
  "grille": [
    "#SS#####",
    "#..#####",
    "#......#",
    "#####..#",
    "#####..#",
    "1o.##..#",
    "#......#",
    "#..##..#",
    "#..##..#",
    "#2.##.3#",
    "########"
  ],
  "eau": 5,
  "vannes": [
    { "type": "robinet" },
    { "type": "vidange" },
    { "type": "vidange" }
  ]
}
</script>

<!-- ------------------------------------------------------------------
     LE MOTEUR. Pur et déterministe. L'eau est une masse par petite case
     (0 à 1) : chaque case du labyrinthe en contient 4 × 4 (« finesse »),
     et une image enchaîne 4 pas de calcul. À chaque pas :
       1. la chute : chaque case verse dans celle de dessous ce qui y tient ;
       2. l'étalement (trois passes) : une case posée partage avec ses
          voisines de côté — l'eau se met vite à plat, et celle qui arrive
          au bord d'un vide y passe et tombe ;
       3. la pression : dans un corps d'eau pleine, la surface la plus haute
          pousse vers la plus basse — les vases communicants.
     La boule flotte (elle monte et descend avec la surface, bute sous un
     plafond) et prend la vitesse de l'eau qui l'entoure : un courant réel,
     né des vannes, la porte. Elle avance aussi en 4 petits pas par image et
     touche les murs comme un disque : elle glisse le long d'un mur, roule
     sur un coin, et ne passe sous un linteau que si l'eau la laisse passer.
     ------------------------------------------------------------------ -->
<script id="moteur">
"use strict";
const Labyrinthe = (function () {
  // Deux échelles. Le LABYRINTHE (murs, vannes, sortie, boule, unités de
  // jeu) se compte en cases. L'EAU se calcule en petites cases : chaque case
  // du labyrinthe en contient FIN × FIN, et un pas de jeu (une image) en
  // enchaîne FIN de calcul, pour que l'eau aille aussi vite qu'à gros grain.
  // ---- réglages de l'eau (en cases du labyrinthe) ----
  const DEBIT = 0.1;       // ce qu'un robinet verse, ou qu'une vidange retire, par image
  const SEC = 0.05;        // sous cette eau, une vidange n'a plus rien à prendre : la tape est refusée
  const UNITE = 1;         // une tape = une case d'eau
  // ---- réglages de la boule (en cases, par image) ----
  const RAYON = 0.34;
  const FLOTTE = 0.08;     // le centre de la boule flotte un peu au-dessus de la surface
  const RESSORT = 0.08, AMORTI = 0.8, PESANTEUR = 0.02, CHUTE_MAX = 0.3;
  const PORTE = 2.5;       // la boule prend cette part de la vitesse de l'eau qui l'entoure
  const SUIT = 0.1;        // et s'y accorde à ce rythme
  const ATTIRE = 1.5;      // elle sent le courant jusqu'à cette distance, en cases
  const FROTTE = 0.85;     // au sec, elle s'arrête
  // ---- repos ----
  const CALME = 2e-4, CALME_PAS = 30, MAXPAS = 6000;

  const caches = new WeakMap();
  function prep(N) {
    let c = caches.get(N);
    if (c) return c;
    const H = N.grille.length, W = N.grille[0].length, S = N.finesse || 4;
    const mur = new Uint8Array(W * H), sortie = new Uint8Array(W * H), plein = new Uint8Array(W * H);
    const vannes = [];
    let boule = null;
    for (let r = 0; r < H; r++) for (let x = 0; x < W; x++) {
      const ch = N.grille[r][x], y = H - 1 - r, i = y * W + x;
      if (ch === "#") mur[i] = 1;
      else if (ch === "S") sortie[i] = 1;
      else if (ch === "o") boule = { x: x + 0.5, y: y + 0.5 };
      else if (ch === "~") plein[i] = 1;
      else if (ch >= "1" && ch <= "9") vannes[+ch - 1] = { ...N.vannes[+ch - 1], x, y, i };
    }
    if (N.eau) for (let y = 0; y < N.eau; y++) for (let x = 0; x < W; x++) {
      const i = y * W + x;
      if (!mur[i] && !sortie[i]) plein[i] = 1;
    }
    // la grille fine de l'eau
    const SW = W * S, SH = H * S;
    const fmur = new Uint8Array(SW * SH), fsortie = new Uint8Array(SW * SH), m0 = new Float64Array(SW * SH);
    for (let fy = 0; fy < SH; fy++) for (let fx = 0; fx < SW; fx++) {
      const i = Math.floor(fy / S) * W + Math.floor(fx / S), j = fy * SW + fx;
      fmur[j] = mur[i]; fsortie[j] = sortie[i]; m0[j] = plein[i];
    }
    for (const v of vannes) {
      // un robinet verse par un seul point : le milieu de sa case, poussé
      // vers l'intérieur s'il est dans un mur du bord — l'eau en sort en jet
      const bx = v.x === 0 ? S - 1 : v.x === W - 1 ? 0 : Math.floor(S / 2);
      const by = v.y === H - 1 ? 0 : Math.floor(S / 2);
      v.bec = (v.y * S + by) * SW + v.x * S + bx;
      v.bloc = []; v.fond = [];
      for (let dy = 0; dy < S; dy++) for (let dx = 0; dx < S; dx++) {
        const j = (v.y * S + dy) * SW + v.x * S + dx;
        v.bloc.push(j);
        if (dy === 0) v.fond.push(j);
      }
    }
    c = { W, H, S, mur, sortie, vannes, boule, SW, SH, fmur, fsortie, m0, S2: S * S };
    caches.set(N, c);
    return c;
  }
  const ouvert = (G, x, y) => x >= 0 && y >= 0 && x < G.W && y < G.H && !G.mur[y * G.W + x];
  const fouvert = (G, x, y) => x >= 0 && y >= 0 && x < G.SW && y < G.SH && !G.fmur[y * G.SW + x];
  const idx = (G, x, y) => y * G.W + x;
  const fidx = (G, x, y) => y * G.SW + x;

  function charger(N) {
    const G = prep(N), n = G.SW * G.SH;
    const e = {
      m: Float64Array.from(G.m0), b: { x: G.boule.x, y: G.boule.y, vx: 0, vy: 0 },
      attente: G.vannes.map(() => 0), tapes: 0, verse: 0, sorti: 0, vide: 0, gagne: false, calme: 0, pas: 0,
      fx: new Float64Array(n), fy: new Float64Array(n),      // le courant d'une image, en petites cases
    };
    for (let k = 0; k < 400; k++) bouger(N, e, 1);   // la boule se pose avant que la partie commence
    e.b.vx = e.b.vy = 0;
    return e;
  }
  function copie(e) {
    return { m: Float64Array.from(e.m), b: { ...e.b }, attente: e.attente.slice(), tapes: e.tapes, verse: e.verse, sorti: e.sorti,
      vide: e.vide, gagne: e.gagne, calme: e.calme, pas: e.pas, fx: Float64Array.from(e.fx), fy: Float64Array.from(e.fy) };
  }
  // L'eau d'une case du labyrinthe, en cases (la somme de ses petites cases).
  function eauDe(G, e, cases) { let s = 0; for (const j of cases) s += e.m[j]; return s / G.S2; }

  // Un pas de calcul de l'eau, sur la grille fine. Trois mouvements :
  //   1. la chute : chaque case verse dans la case de dessous ce qui y tient ;
  //   2. l'étalement : une case posée (sur un mur ou sur de l'eau pleine)
  //      partage avec ses voisines de côté — l'eau qui arrive au bord d'un
  //      vide y passe et tombe ;
  //   3. la pression : un corps d'eau pleine n'a qu'un niveau. Sa surface
  //      la plus haute verse dans la plus basse, de moitié d'écart en
  //      moitié d'écart, jusqu'à être à plat — les vases communicants, sans
  //      butte sous un robinet. Le courant est compté le long du chemin.
  // fx[i] : ce qui passe de i vers la droite ; fy[i] : de i vers le haut.
  const PLEIN = 0.99, VIDE = 0.005, ECART = 0.02, ETALE = 3;
  const NIVELLE_MAX = 0.4;     // ce qu'un corps d'eau fait passer en un pas de calcul, en petites cases (½ case du labyrinthe par image)
  const NIVELLE_FOIS = 24;   // et en combien de versements au plus
  function eau(N, e) {
    const G = prep(N), W = G.SW, H = G.SH, n = e.m;
    let total = 0;
    const libre = i => !G.fmur[i];
    for (let y = 1; y < H; y++) for (let x = 0; x < W; x++) {
      const i = y * W + x, j = i - W;
      if (!libre(i) || G.fsortie[i] || !libre(j) || n[i] <= 0) continue;
      const q = Math.min(n[i], 1 - n[j]);
      if (q > 1e-9) { n[i] -= q; n[j] += q; e.fy[j] -= q; total += q; }
    }
    // l'étalement passe ETALE fois par pas : l'eau se met à plat vite, comme
    // une vraie eau, au lieu de s'entasser en butte sous le robinet
    for (let passe = 0; passe < ETALE; passe++) {
      const s = Float64Array.from(n);
      const pose = i => i < W || G.fmur[i - W] || s[i - W] >= PLEIN;
      for (let i = 0; i < n.length; i++) {
        if (!libre(i) || G.fsortie[i] || s[i] <= VIDE || !pose(i)) continue;
        const x = i % W;
        for (const d of [-1, 1]) {
          const nx = x + d;
          if (nx < 0 || nx >= W) continue;
          const j = i + d;
          if (!libre(j)) continue;
          const q = (s[i] - s[j]) / 4;
          if (q <= 1e-9) continue;
          n[i] -= q; n[j] += q; total += q;
          if (d > 0) e.fx[i] += q; else e.fx[j] -= q;
        }
      }
    }
    total += pression(N, e);
    for (let i = 0; i < n.length; i++) if (G.fsortie[i] && n[i] > 0) { e.sorti += n[i] / G.S2; n[i] = 0; }
    return total;
  }
  function voisins(G, i) {
    const W = G.SW, x = i % W, y = (i - x) / W, r = [];
    if (x + 1 < W && !G.fmur[i + 1]) r.push(i + 1);
    if (x > 0 && !G.fmur[i - 1]) r.push(i - 1);
    if (y + 1 < G.SH && !G.fmur[i + W]) r.push(i + W);
    if (y > 0 && !G.fmur[i - W]) r.push(i - W);
    return r;
  }
  function pression(N, e) {
    const G = prep(N), W = G.SW, n = e.m, vu = new Uint8Array(n.length);
    let total = 0;
    for (let i0 = 0; i0 < n.length; i0++) {
      if (vu[i0] || G.fmur[i0] || G.fsortie[i0] || n[i0] < PLEIN) continue;
      const corps = [i0];
      vu[i0] = 1;
      for (let q = 0; q < corps.length; q++) for (const j of voisins(G, corps[q])) {
        if (!vu[j] && !G.fsortie[j] && n[j] >= PLEIN) { vu[j] = 1; corps.push(j); }
      }
      const dans = new Set(corps);
      // ses surfaces : les cases où sa surface libre peut monter (reçoit) ;
      // tant qu'elle est vide, l'eau qui en descend vient de la case pleine
      // dessous (k). Une sortie est une surface qui avale tout.
      const surf = [], vues = new Set();
      for (const k of corps) for (const j of voisins(G, k)) {
        if (dans.has(j) || vues.has(j)) continue;
        const y = Math.floor(j / W), dessous = j - W;
        if (G.fsortie[j]) { vues.add(j); surf.push({ k, recoit: j, sortie: true }); continue; }
        const posee = y === 0 || G.fmur[dessous] || dans.has(dessous) || n[dessous] >= PLEIN;
        const dessus = j + W, airDessus = y + 1 >= G.SH || G.fmur[dessus] || n[dessus] <= VIDE;
        if (posee && airDessus) { vues.add(j); surf.push({ k, recoit: j, sortie: false }); }
      }
      if (!surf.length) continue;
      const hauteur = s => Math.floor(s.recoit / W) + (s.sortie ? 0 : n[s.recoit]);
      const donneur = s => n[s.recoit] > VIDE ? s.recoit : s.k;
      const plusBasse = () => { let b = surf[0]; for (const s of surf) if (hauteur(s) < hauteur(b)) b = s; return b; };
      // une case trop pleine (le robinet dans un corps fermé) pousse son
      // surplus à travers le corps, jusqu'à la surface la plus basse
      for (const k of corps) {
        const surplus = n[k] - 1;
        if (surplus <= 1e-4) continue;
        const bas = plusBasse();
        if (k === bas.recoit) continue;
        const q = Math.min(surplus, 0.5);
        n[k] -= q; n[bas.recoit] += q; total += q;
        courant(G, e, k, bas.recoit, dans, q);
      }
      // LE NIVELLEMENT : le corps n'a qu'un niveau. Tant que sa surface la
      // plus haute dépasse la plus basse, on verse de l'une dans l'autre la
      // moitié de l'écart — les deux se rejoignent — jusqu'à être à plat, ou
      // jusqu'au débit qu'un corps peut faire passer en un pas.
      let deplace = 0;
      for (let fois = 0; fois < NIVELLE_FOIS && deplace < NIVELLE_MAX; fois++) {
        let haut = null, bas = null, hh = -Infinity, hb = Infinity;
        for (const s of surf) {
          const h = hauteur(s);
          if (!s.sortie && n[donneur(s)] > VIDE && h > hh) { haut = s; hh = h; }
          if (h < hb) { bas = s; hb = h; }
        }
        if (!haut || haut === bas || hh - hb <= ECART) break;
        const de = donneur(haut);
        let q = Math.min(n[de], (hh - hb) / 2, NIVELLE_MAX - deplace);
        if (!bas.sortie) q = Math.min(q, 1 - n[bas.recoit]);
        if (q <= 1e-9) break;
        n[de] -= q; n[bas.recoit] += q; total += q; deplace += q;
        courant(G, e, de, bas.recoit, dans, q);
      }
    }
    return total;
  }
  // Le courant d'une poussée : le long du plus court chemin dans le corps.
  function courant(G, e, de, vers, dans, q) {
    const W = G.SW, prec = new Map([[de, -1]]), file = [de];
    for (let k = 0; k < file.length && !prec.has(vers); k++) for (const j of voisins(G, file[k])) {
      if (prec.has(j) || !(dans.has(j) || j === vers)) continue;
      prec.set(j, file[k]); file.push(j);
    }
    if (!prec.has(vers)) return;
    for (let j = vers; prec.get(j) !== -1; j = prec.get(j)) {
      const a = prec.get(j);
      if (j === a + 1) e.fx[a] += q; else if (j === a - 1) e.fx[j] -= q;
      else if (j === a + W) e.fy[a] += q; else e.fy[j] -= q;
    }
  }

  // Les vannes, pour un pas de calcul : un robinet verse par son bec, une
  // vidange prend par le fond de sa case.
  function vannes(N, e) {
    const G = prep(N), part = 1 / G.S;
    let actif = false;
    G.vannes.forEach((v, k) => {
      const a = e.attente[k];
      if (a <= 0) return;
      if (v.type === "robinet") {
        const q = Math.min(a, DEBIT * part);
        e.m[v.bec] += q * G.S2;
        e.verse += q; e.attente[k] -= q; actif = true;
      } else {
        const dispo = eauDe(G, e, v.fond);
        const q = Math.min(a, DEBIT * part, dispo);
        if (q <= 1e-9) { e.attente[k] = 0; return; }       // à sec : la vidange n'a plus rien à prendre
        const r = q / dispo;
        for (const j of v.fond) e.m[j] -= e.m[j] * r;
        e.vide += q; e.attente[k] -= q; actif = true;
      }
      if (e.attente[k] < 1e-9) e.attente[k] = 0;
    });
    return actif;
  }

  // La hauteur d'eau sous la boule (ou au-dessus, si elle est sous l'eau),
  // dans sa petite colonne, en cases. plafond : l'eau monte jusqu'à un mur.
  const PLEINE = 0.98, SECHE = 0.02;
  function niveau(N, e, x, y) {
    const G = prep(N), S = G.S, cx = Math.floor(x * S);
    let cy = Math.min(G.SH - 1, Math.max(0, Math.floor(y * S)));
    const m = c => e.m[fidx(G, cx, c)];
    if (!fouvert(G, cx, cy)) return { h: null };

      while (m(cy) >= PLEINE && fouvert(G, cx, cy + 1) && m(cy + 1) > SECHE) cy++;
      if (m(cy) >= PLEINE && !fouvert(G, cx, cy + 1)) return { h: (cy + 1) / S, plafond: true };
      return { h: (cy + Math.min(1, m(cy))) / S };

    while (cy > 0 && fouvert(G, cx, cy - 1) && m(cy - 1) <= SECHE) cy--;

  // fine), dans la bande de hauteur où trempe la boule, en cases par image.
  function vitesse(G, e, fxc, y0, y1) {
    const S = G.S;
    let q = 0, mouille = 0;
    for (let fy = Math.max(0, Math.floor(y0 * S)); fy < Math.min(G.SH, Math.ceil(y1 * S)); fy++) {

      const i = fidx(G, fxc, fy);
      q += e.fx[i];
      mouille += Math.min(1, (e.m[i] + e.m[i + 1]) / 2);

  // case de mur qu'elle touche, le point du mur le plus proche de son centre,
  // et on la ressort le long de cette normale. Elle glisse le long des murs
  // et roule sur les coins au lieu de s'y accrocher.
  function contacts(G, b) {
    for (let passe = 0; passe < 2; passe++) {
      for (let cy = Math.floor(b.y - RAYON); cy <= Math.floor(b.y + RAYON); cy++) {
        for (let cx = Math.floor(b.x - RAYON); cx <= Math.floor(b.x + RAYON); cx++) {
          if (ouvert(G, cx, cy)) continue;
          const px = Math.max(cx, Math.min(cx + 1, b.x)), py = Math.max(cy, Math.min(cy + 1, b.y));
          let nx = b.x - px, ny = b.y - py;
          const d = Math.sqrt(nx * nx + ny * ny);
          if (d >= RAYON) continue;
          if (d < 1e-9) {                               // le centre est entré dans le mur : on le ressort par le côté le plus proche
            const cotes = [[b.x - cx, -1, 0], [cx + 1 - b.x, 1, 0], [b.y - cy, 0, -1], [cy + 1 - b.y, 0, 1]].sort((p, q) => p[0] - q[0]);
            nx = cotes[0][1]; ny = cotes[0][2];
            b.x += nx * (cotes[0][0] + RAYON); b.y += ny * (cotes[0][0] + RAYON);
          } else {
            nx /= d; ny /= d;
            b.x += nx * (RAYON - d); b.y += ny * (RAYON - d);
          }
          const vn = b.vx * nx + b.vy * ny;
          if (vn < 0) { b.vx -= vn * nx; b.vy -= vn * ny; }
        }

  }
  // x à la puissance dt, pour dt = 1, 1/2 ou 1/4, par des racines carrées
  // seulement : Math.sqrt est arrondi exactement (IEEE-754) partout, alors
  // que Math.pow peut différer d'un dernier chiffre entre Node (le banc) et
  // Safari (le jeu) — et la boule doit faire la même chose des deux côtés.
  function puissance(x, dt) {
    if (dt === 1) return x;
    if (dt === 0.5) return Math.sqrt(x);

  }
  // La boule, pour une fraction dt d'image : elle flotte, tombe au sec, et
  // l'eau qui l'entoure l'emporte. Vitesses en cases par image.
  function bouger(N, e, dt) {
    const G = prep(N), b = e.b, S = G.S;

      // de son centre — une boule près d'une sortie d'eau y est aspirée —,
      // dans la bande où elle trempe et une petite case en dessous (l'eau

      const y0 = b.y - RAYON - 1 / S, y1 = Math.min(b.y + RAYON, nv.h);

    for (let k = 0; k < G.S; k++) bouger(N, e, 1 / G.S);   // la boule aussi, en petits pas

  function cle(e) {
    let s = "";
    for (let i = 0; i < e.m.length; i++) s += Math.round(e.m[i] * 10).toString(36);
    return s + "|" + Math.round(e.b.x * 10) + "," + Math.round(e.b.y * 10) + (e.gagne ? "!" : "");
  }

  return { prep, charger, copie, taper, pas, repos, reposer, jouer, cle, niveau, ouvert, fouvert, idx, fidx, eauDe, RAYON };
})();

        if ((dx || dy) && nx >= 0 && ny >= 0 && nx < W && ny < H && !G.fmur[ny * W + nx]) v = Math.max(v, BRUT[ny * W + nx]);

    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      let s = 0, p = 0;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        const nx = x + dx, ny = y + dy;

      const d = c.map(a => a >= SEUIL);

      if (d[0] !== d[1]) e[0] = arete(`h${i},${j}`, c[0], c[1], i, j, i + 1, j);

      if (d[3] !== d[2]) e[2] = arete(`h${i},${j + 1}`, c[3], c[2], i, j + 1, i + 1, j + 1);
      if (d[0] !== d[3]) e[3] = arete(`v${i},${j}`, c[0], c[3], i, j, i, j + 1);

  function dessinerGouttes() {

      gouttes.push({ x, y, vx: (hasard() - 0.5) * 0.06, vy: 0.03 + hasard() * 0.05, vie: 18 + Math.floor(hasard() * 10) });
    }
    let s = "";
    gouttes = gouttes.filter(g => {
      g.x += g.vx; g.y += g.vy; g.vy -= 0.008; g.vie--;
      const fx = Math.floor(g.x * G.S), fy = Math.floor(g.y * G.S);
      if (g.vie <= 0 || !L.fouvert(G, fx, fy) || (g.vy < 0 && m[fy * W + fx] > 0.5)) return false;
      s += `<circle cx="${f(g.x)}" cy="${f(Y(g.y))}" r="${f(0.035 + 0.002 * g.vie)}" fill="${C.ecume}"/>`;
      return true;
    });
    $("jets").innerHTML = s;
  }

  // --- les vannes -----------------------------------------------------
  function dessinerVannes() {
    let s = "";
    G.vannes.forEach((v, k) => {
      const b = bouton(v), rob = v.type === "robinet";
      const enfonce = (appui && appui.k === k) || v.presse > 0 ? 0.08 : 0;
      if (v.presse > 0) v.presse--;
      const coul = rob ? C.robinet : C.vidange, ombre = rob ? C.robinetOmbre : C.vidangeOmbre;
      const cx = b.x, py = Y(b.y) + enfonce;
      s += `<g class="cible" data-k="${k}" role="button" aria-label="${rob ? "Robinet" : "Vidange"}">`;
      s += `<circle cx="${f(cx)}" cy="${f(Y(b.y) + 0.08)}" r="0.62" fill="${ombre}"/>`;
      s += `<circle cx="${f(cx)}" cy="${f(py)}" r="0.6" fill="${coul}" stroke="#fff" stroke-width="0.06"/>`;
      if (rob) {
        s += `<path d="M${f(cx)} ${f(py - 0.32)}c0.18 0.22 0.28 0.36 0.28 0.5a0.28 0.28 0 0 1-0.56 0c0-0.14 0.1-0.28 0.28-0.5z" fill="#fff"/>`;
        s += `<text x="${f(cx + 0.36)}" y="${f(py - 0.2)}" font-size="0.36" font-weight="700" fill="#fff" font-family="Fredoka, sans-serif">+</text>`;
      } else {
        s += `<path d="M${f(cx - 0.26)} ${f(py - 0.1)}h0.52M${f(cx - 0.18)} ${f(py + 0.06)}h0.36M${f(cx - 0.1)} ${f(py + 0.22)}h0.2" stroke="#fff" stroke-width="0.09" stroke-linecap="round"/>`;
        s += `<text x="${f(cx + 0.3)}" y="${f(py - 0.18)}" font-size="0.36" font-weight="700" fill="#fff" font-family="Fredoka, sans-serif">−</text>`;
      }
      s += `</g>`;
    });
    $("vannes").innerHTML = s;
  }

  // La boule roule : elle tourne d'autant que son centre avance.
  let angle = 0, xAvant = null;
  function dessinerBoule() {
    const x = etat.b.x, y = Y(etat.b.y);
    if (xAvant !== null && Math.abs(x - xAvant) < 1) angle += (x - xAvant) / R;
    xAvant = x;
    $("boule").innerHTML =
      `<g transform="rotate(${f(angle * 180 / Math.PI)} ${f(x)} ${f(y)})">` +
      `<circle cx="${f(x)}" cy="${f(y)}" r="${R}" fill="${C.blanc}" stroke="${C.blancOmbre}" stroke-width="0.04"/>` +
      `<path d="M${f(x - R)} ${f(y)}a${R} ${R} 0 0 1 ${f(2 * R)} 0z" fill="${C.rouge}"/>` +
      `<rect x="${f(x - R)}" y="${f(y - 0.04)}" width="${f(2 * R)}" height="0.08" fill="${C.rougeOmbre}"/></g>` +
      `<circle cx="${f(x - R * 0.35)}" cy="${f(y - R * 0.5)}" r="${f(R * 0.22)}" fill="#fff" opacity="0.7"/>`;
  }

  // --- le jeu ---------------------------------------------------------
  function majHud() {
    $("titre").innerHTML = `Niveau <b>1</b> · ${N.titre}`;
    $("conseil").textContent = N.conseil;
    $("tapes").innerHTML = `tapes <b>${etat.tapes}</b> · par ${N.par}`;
    $("b-annuler").disabled = !histoire.length;
  }
  function charger() {
    histoire = []; fini = false; attente = 0; appui = null; gouttes = []; xAvant = null;
    $("v-fin").hidden = true;
    etat = L.charger(N);
    majHud();
  }
  function taper(k) {
    if (fini) return false;
    const r = L.taper(N, etat, k);
    G.vannes[k].presse = 6;
    if (!r) return false;                             // rien à vider
    histoire.push(etat);
    etat = r;
    majHud();
    return true;
  }
  function montrerFin() {
    const t = etat.tapes;
    $("fin-titre").textContent = "La boule est libre !";
    $("fin-texte").textContent = t <= N.par ? `En ${t} tapes : parfait.` : `En ${t} tapes (par ${N.par}).`;
    $("fin-boutons").innerHTML = `<button class="bouton vert" data-act="rejouer">Rejouer</button>`;
    $("v-fin").hidden = false;
  }
  function annuler() {
    if (!histoire.length) return;
    fini = false; attente = 0; appui = null; $("v-fin").hidden = true;
    etat = histoire.pop();
    majHud();
  }

  let dernier = 0;
  function etape(ts) {
    dernier = ts; temps = ts / 1000; image_n++;
    // l'appui long verse ou vide en continu : une unité de plus dès que la
    // précédente est passée — au débit de la vanne, et une vidange qui peine
    // (presque à sec) ne compte pas plus de tapes que d'eau sortie
    if (appui && !fini && image_n - appui.depuis >= APPUI_LONG && etat.attente[appui.k] < 0.05) taper(appui.k);
    L.pas(N, etat);
    if (etat.gagne && !fini) { fini = true; appui = null; attente = 70; }
    dessinerEau(); dessinerGouttes(); dessinerVannes(); dessinerBoule();
    if (attente > 0 && --attente === 0) montrerFin();
  }
  function image(ts) { etape(ts); requestAnimationFrame(image); }
  // Pour la vérification headless : avancer de n images sans attendre l'écran.
  function avancer(n) { for (let k = 0; k < n; k++) etape(dernier + 1000 / 60); }

  svg.addEventListener("pointerdown", ev => {
    const g = ev.target.closest(".cible");
    if (!g) return;
    ev.preventDefault();
    const k = +g.dataset.k;
    taper(k);
    appui = { k, depuis: image_n };
  });
  const lacher = () => { appui = null; };
  window.addEventListener("pointerup", lacher);
  window.addEventListener("pointercancel", lacher);
  window.addEventListener("blur", lacher);
  $("b-recommencer").onclick = charger;
  $("b-annuler").onclick = annuler;
  $("fin-boutons").onclick = ev => { if (ev.target.closest("[data-act]")) charger(); };

  window.__laby = {
    L, N, etat: () => etat, taper, avancer, charger,
    appuyer: k => { taper(k); appui = { k, depuis: image_n }; }, lacher,
  };
  dessinerDecor();
  charger();
  requestAnimationFrame(image);
})();
</script>
</body>
</html>
