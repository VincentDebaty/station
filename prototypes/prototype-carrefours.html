<style>
/* ------------------------------------------------------------------
   LES CARREFOURS — prototype (20 octobre 2026), suite du Carrefour.
   Vincent : « passe à plusieurs carrefours, mais moins dense, car vite en
   colère ». Une avenue vue de dessus, deux carrefours (les Tilleuls en
   haut, la Gare en bas, sur la rue du tram). Chaque carrefour a ses feux
   AUTOMATIQUES : l'avenue, la rue, les piétons, chacun pendant la durée que
   le joueur règle (− / +) dans le panneau du bas. Les voitures de l'avenue
   traversent les deux carrefours : entre eux, le tronçon ne tient que
   quelques voitures, et une voiture ne s'engage pas si elle ne peut pas
   dégager le carrefour.

   Même charte que Le pontier et Le carrefour : plateau vu de dessus, bois
   et crème, Lilita One. Un seul aspect, voulu (pas de thème sombre).
   Le banc : node tools/carrefours-banc.mjs.
   ------------------------------------------------------------------ */
:root {
  color-scheme: light;
  --pave: #efe0c2;
  --bois: #7a4a26;
  --bois-fonce: #5a3418;
  --creme: #fff3dc;
  --encre: #3b2414;
  --or: #ffc93c;
  --ok: #4caf3e;
  --alerte: #e0533d;
  --feu-vert: #3fc25a;
  --feu-orange: #ffae2b;
  --feu-rouge: #e8452f;
  --chiffres: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
  --texte: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden;
  background: var(--bois); color: var(--creme);
  font-family: var(--texte);
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--or); outline-offset: 2px; }
[hidden] { display: none !important; }

#jeu { height: 100%; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); }
.bandeau {
  display: flex; align-items: center; gap: 8px;
  padding: 8px max(16px, env(safe-area-inset-right, 0px)) 4px max(16px, env(safe-area-inset-left, 0px));
}
.humeur { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; }
.humeur svg { width: 30px; height: 30px; flex: none; }
.humeur .mini { flex: 1; min-width: 30px; height: 14px; border-radius: 999px; background: rgba(0, 0, 0, .3); border: 3px solid var(--bois-fonce); overflow: hidden; }
.humeur .mini span { display: block; height: 100%; background: var(--ok); }
.pastille {
  font: 400 1.05rem/1 var(--chiffres); background: var(--bois-fonce); border-radius: 999px;
  padding: 8px 11px; font-variant-numeric: tabular-nums; white-space: nowrap;
}
.rond {
  width: 38px; height: 38px; flex: none; padding: 0; border-radius: 999px;
  border: 3px solid #c9b48c; background: var(--creme); color: var(--encre);
  font: 400 .95rem/1 var(--chiffres); box-shadow: 0 3px 0 #b39a6c;
  display: inline-flex; align-items: center; justify-content: center;
}
.rond:active { transform: translateY(2px); box-shadow: 0 1px 0 #b39a6c; }
.rond svg { width: 17px; height: 17px; }
.objectif {
  display: flex; flex-direction: column; gap: 10px;
  padding: 2px max(16px, env(safe-area-inset-right, 0px)) 6px max(16px, env(safe-area-inset-left, 0px));
}
.objectif .ligne { display: flex; gap: 8px; align-items: baseline; font: 400 1.15rem/1 var(--chiffres); font-variant-numeric: tabular-nums; }
.objectif .ligne small { font: 600 11px/1 var(--texte); letter-spacing: .08em; text-transform: uppercase; color: rgba(255, 243, 220, .7); }
.barre { position: relative; height: 16px; border-radius: 999px; background: rgba(0, 0, 0, .3); border: 3px solid var(--bois-fonce); }
.barre > span { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; background: var(--or); }
.barre i { position: absolute; top: -9px; transform: translateX(-50%); font: 400 13px/1 var(--chiffres); font-style: normal; color: var(--or); text-shadow: 0 1px 0 #5a3418; white-space: nowrap; }
.barre i.eteinte { color: rgba(255, 243, 220, .45); }
#horaire {
  display: flex; gap: 6px; overflow: hidden; min-height: 30px;
  padding: 2px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px));
}
.puce {
  flex: none; display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px;
  background: rgba(255, 243, 220, .14); font: 400 .9rem/1 var(--chiffres); white-space: nowrap; font-variant-numeric: tabular-nums;
}
.puce.tram { background: rgba(47, 158, 88, .55); }
.puce.vague { background: rgba(255, 201, 60, .3); }
.puce.vide { background: none; color: rgba(255, 243, 220, .6); font-family: var(--texte); font-size: .85rem; }

.scene { position: relative; flex: 1 1 auto; min-height: 0; background: var(--pave); }
canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.message {
  position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%);
  max-width: calc(100% - 32px); padding: 8px 14px; border-radius: 999px;
  background: var(--encre); color: var(--creme); font: 400 1rem/1.2 var(--chiffres); text-align: center;
  box-shadow: 0 4px 0 rgba(0, 0, 0, .25);
}

/* le panneau des réglages : un carton par carrefour */
#reglages {
  display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
  padding: 8px max(16px, env(safe-area-inset-right, 0px)) max(10px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.panneau { min-width: 0; background: var(--creme); color: var(--encre); border-radius: 14px; border: 3px solid #c9b48c; padding: 6px 6px 4px; }
.panneau h3 { margin: 0 0 4px 4px; font: 400 .95rem/1.1 var(--chiffres); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rang { position: relative; display: grid; grid-template-columns: 1fr 30px 36px 30px; align-items: center; gap: 2px; height: 36px; }
.rang .lampe {
  display: flex; align-items: center; gap: 5px; min-width: 0; height: 34px; padding: 0 2px; border: 0; background: none;
  font: 600 12px/1 var(--texte); color: var(--encre); text-align: left;
}
.rang .lampe i { flex: none; width: 12px; height: 12px; border-radius: 999px; background: var(--feu-rouge); box-shadow: 0 0 0 2px #2a2420; }
.rang .lampe span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rang .pm {
  width: 30px; height: 30px; padding: 0; border-radius: 999px; border: 0; background: var(--encre); color: #fff;
  font: 400 1.25rem/1 var(--chiffres); display: inline-flex; align-items: center; justify-content: center;
}
.rang .pm:disabled { background: rgba(59, 36, 20, .25); }
.rang b { font: 400 1.05rem/1 var(--chiffres); text-align: center; font-variant-numeric: tabular-nums; }
.rang .reste { position: absolute; left: 4px; bottom: 0; height: 3px; border-radius: 2px; background: var(--feu-vert); }

.carte {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: min(23rem, calc(100% - 32px)); max-height: calc(100% - 24px); overflow-y: auto;
  background: var(--bois); color: var(--creme); border: 4px solid var(--bois-fonce); border-radius: 18px;
  padding: 18px 20px 20px; text-align: center;
  box-shadow: 0 8px 0 #4a2a12, 0 14px 30px rgba(30, 15, 5, .35);
}
.carte h2 { margin: 0 0 8px; font: 400 1.8rem/1.1 var(--chiffres); text-wrap: balance; }
.carte p { margin: 0 0 12px; line-height: 1.4; }
.carte .etoiles { font: 400 2.4rem/1 var(--chiffres); color: var(--or); text-shadow: 0 3px 0 #8a5a12; letter-spacing: 4px; margin-bottom: 8px; }
.carte .etoiles .eteinte { color: rgba(255, 243, 220, .3); text-shadow: none; }
.carte ul { list-style: none; margin: 0 0 14px; padding: 0; display: grid; gap: 4px; font: 400 1rem/1.2 var(--chiffres); }
.carte .regle { text-align: left; margin: 0 0 14px; padding-left: 18px; display: block; font: 15px/1.4 var(--texte); }
.carte .regle li { list-style: disc; margin-bottom: 4px; }
.carte button {
  font: 400 1.15rem/1 var(--chiffres); color: #fff; background: var(--ok);
  border: 3px solid #2f7d25; border-radius: 999px; padding: 12px 26px; box-shadow: 0 3px 0 #2f7d25;
}
@media (max-width: 380px) { .pastille { padding: 7px 8px; font-size: .95rem; } .rond { width: 34px; height: 34px; } .rang { grid-template-columns: 1fr 28px 32px 28px; } .rang .pm { width: 28px; height: 28px; } .rang .lampe { font-size: 11px; } }
@media (prefers-reduced-motion: reduce) { .rond:active { transform: none; } }
</style>
</head>

<!-- ==================================================================
     LE NIVEAU — du JSON pur. Les durées sont en secondes, les longueurs en
     pixels du plateau (400 × 720, vu de dessus) : la vue dessine les voies
     aux mêmes cotes.
       carrefours  nom, et le réglage de départ de ses feux : la durée du
                   vert de l'avenue, de la rue, des piétons (s)
       cycle       les bornes d'un réglage (min, max), par phase ; 0 pour
                   les piétons : on saute leur phase (le panneau montre « 0 s »)
       voies       chaque voie d'arrivée : son axe (0 l'avenue, 1 une rue),
                   ses ARRÊTS dans l'ordre (le carrefour, L la ligne d'arrêt
                   depuis le bord, B la zone de conflit jusqu'au bout du
                   passage piéton d'en face), et fin (le bord de sortie)
       tram        les deux voies que suit le tram (sens 0 vers l'est, 1
                   vers l'ouest), sur ses propres rails
       vehicule    vitesse (px/s), ecart (de l'avant d'une voiture à l'avant
                   de la suivante, à l'arrêt), longueur, tram (sa longueur),
                   debit (une voiture au plus franchit une ligne d'arrêt
                   toutes les « debit » secondes : le démarrage au vert)
       feux        orange (s) ; degagement (le rouge intégral minimal, après
                   quoi le nouveau vert attend encore que la zone soit vide)
       patience    l'attente qu'on supporte à UN feu, arrêté ; au-delà, une
                   voiture fait demi-tour et un piéton s'en va : ils ne
                   comptent plus, et l'humeur perd « colere » d'un coup. Le
                   tram reste, et retire « colere » par seconde
       pietons     traversee (s)
       vagues      de, a, l'intervalle (s) entre deux arrivées sur chaque
                   voie, et pour les piétons (P), qui vont à tour de rôle à
                   chaque carrefour ; 0 : personne
       trams       l'horaire du tram : heure, sens ; il compte « tram »
                   personnes
       duree       de 17 h à 18 h, en secondes de jeu
       quota       les personnes à faire passer avant 18 h : c'est réussi
       etoiles     comptées en POINTS : les passés plus l'humeur qui reste à
                   18 h ; une étoile au quota, deux et trois aux seuils
       par         le meilleur score du banc — node tools/carrefours-banc.mjs
                   refuse si le par écrit n'est pas celui qu'il retrouve
     ================================================================== -->

<script id="moteur">
"use strict";
const Carrefours = (function () {

  // --- Le modèle ---------------------------------------------------------------
  // Plusieurs carrefours le long d'une avenue. Chacun a trois PHASES : 0
  // l'avenue au vert, 1 sa rue au vert, 2 ses piétons. Une seule est verte à
  // la fois dans un carrefour (l'enclenchement de Station).
  //
  //   les feux      AUTOMATIQUES : un cycle avenue → rue → piétons par
  //                 carrefour, chaque vert dure ce que le joueur a réglé (une
  //                 phase réglée à 0 est sautée). Le joueur JAUGE : il
  //                 allonge ou raccourcit un vert d'une seconde par geste, et
  //                 peut forcer une phase tout de suite. Quitter une phase :
  //                 l'orange, puis le rouge ; la suivante ne passe au vert
  //                 qu'après « degagement » s ET quand la zone de conflit est
  //                 vide.
  //   les voitures  elles suivent leur voie, en file, sans se doubler, et
  //                 franchissent ses arrêts dans l'ordre : au vert de leur
  //                 axe, une par voie et par arrêt toutes les « debit »
  //                 secondes, et SEULEMENT s'il reste de la place avant
  //                 l'arrêt suivant (on ne bloque pas un carrefour). Arrêtée
  //                 plus que sa patience à un même feu, une voiture RENONCE :
  //                 demi-tour, elle ne comptera pas, et l'humeur prend un
  //                 coup. Elle compte quand elle a passé son dernier carrefour.
  //   le tram       sur ses rails, à l'horaire ; il passe au vert de la rue et
  //                 compte « tram » personnes, mais il s'énerve vite.
  //   les piétons   ils attendent aux coins de leur carrefour et traversent
  //                 tous ensemble pendant sa phase des piétons ; trop
  //                 attendre, ils s'en vont.
  //   la fin        à 18 h (« duree »), gagné si le quota est atteint, raté
  //                 sinon ; perdu avant si l'humeur tombe à zéro. Les étoiles
  //                 se comptent en points : les passés, plus l'humeur qui reste.
  //
  // Positions en pixels du plateau, temps en pas entiers de PAS secondes :
  // la page et le banc jouent la même partie pour les mêmes gestes.

  const PAS = 0.05;
  const pasDe = s => Math.round(s / PAS);
  const heure = e => e.k * PAS;

  const CACHE = new WeakMap();
  function C(N) {
    let c = CACHE.get(N);
    if (c) return c;
    const V = N.vehicule;
    c = {
      V: Math.round(V.vitesse * PAS), GAP: V.ecart, LEN: V.longueur, LTRAM: V.tram, DEBIT: pasDe(V.debit),
      ORANGE: pasDe(N.feux.orange), DEG: pasDe(N.feux.degagement),
      PV: pasDe(N.patience.voiture), PP: pasDe(N.patience.pieton), PT: pasDe(N.patience.tram),
      PIET: pasDe(N.pietons.traversee), FIN: pasDe(N.duree)
    };
    // les places entre un arrêt et le suivant : les voitures qui y tiennent,
    // arrêtées, sans déborder sur la zone qu'elles viennent de passer
    c.places = N.voies.map(v => v.arrets.map((s, i) =>
      i + 1 < v.arrets.length ? Math.floor((v.arrets[i + 1].L - (s.L + s.B + V.longueur)) / V.ecart) + 1 : Infinity));
    const decal = [0, 0.37, 0.61, 0.83, 0.19, 0.71, 0.45, 0.9];
    c.arr = N.voies.map((v, a) => {
      const t = [];
      for (const w of N.vagues) { const iv = w[v.id]; if (iv) for (let x = w.de + decal[a % decal.length] * iv; x < w.a - 1e-9; x += iv) t.push(pasDe(x)); }
      return t.sort((x, y) => x - y);
    });
    c.arrP = [];
    for (const w of N.vagues) if (w.P) for (let x = w.de + 0.5 * w.P; x < w.a - 1e-9; x += w.P) c.arrP.push(pasDe(x));
    c.arrP.sort((x, y) => x - y);
    CACHE.set(N, c);
    return c;
  }
  const voieTram = (N, sens) => N.voies.findIndex(v => v.id === N.tram.voies[sens]);
  // le carrefour et le coin d'un piéton, à tour de rôle
  const coinDe = (N, id) => ({ j: id % N.carrefours.length, k: (Math.floor(id / N.carrefours.length) * 3 + 1) % 4 });

  function charger(N) {
    C(N);
    return {
      k: 0, humeur: 100, passes: 0, fin: null,
      feux: N.carrefours.map(x => ({ phase: 0, etat: "vert", t: 0, demande: null, changements: 0, cycle: x.depart.slice(), attente: [[], [], [], []], traversent: [] })),
      voies: N.voies.map(() => []), nes: N.voies.map(() => 0), franchi: N.voies.map(v => v.arrets.map(() => -1e9)),
      trams: N.trams.map(() => ({ etat: "avant", q: 0, arret: 0, compte: false })),
      nesP: 0, finisP: 0, renonces: N.voies.map(() => 0), renoncesP: 0,
      partis: [],                                              // les renoncements de ce pas (pour la vue)
      perte: { voitures: 0, pietons: 0, tram: 0 },
      detail: { voitures: 0, pietons: 0, tram: 0 }
    };
  }
  const copie = e => JSON.parse(JSON.stringify(e));

  // --- La zone de conflit ---------------------------------------------------------
  const dans = (q, L, B, len) => q > L && q - len < L + B;
  function zoneOccupee(N, e, j, axe) {
    const c = C(N);
    for (let a = 0; a < N.voies.length; a++) {
      const v = N.voies[a];
      if (v.axe !== axe) continue;
      for (const s of v.arrets) if (s.carrefour === j && e.voies[a].some(x => dans(x.q, s.L, s.B, c.LEN))) return true;
    }
    if (axe === 1) for (let i = 0; i < N.trams.length; i++) {
      const tr = e.trams[i], s = N.voies[voieTram(N, N.trams[i].sens)].arrets[0];
      if (s.carrefour === j && tr.etat === "route" && dans(tr.q, s.L, s.B, c.LTRAM)) return true;
    }
    return false;
  }
  const degage = (N, e, j, p) => p === 2 ? e.feux[j].traversent.length === 0 : !zoneOccupee(N, e, j, p);
  const vert = (e, j, p) => e.feux[j].phase === p && e.feux[j].etat === "vert";

  // La phase qui suit p dans le cycle d'un carrefour (on saute celles réglées à 0).
  function suivante(f, p) {
    for (let i = 1; i < 3; i++) { const q = (p + i) % 3; if (f.cycle[q] > 0) return q; }
    return null;
  }
  function demander(f, p) {
    if (f.etat === "vert") { f.etat = "orange"; f.t = 0; f.demande = p; }
    else if (f.etat === "orange" && p === f.phase) { f.etat = "vert"; f.demande = null; }
    else f.demande = p;
  }

  // --- Les gestes : "plusJP", "moinsJP" règlent d'une seconde le vert de la phase P
  // (0 l'avenue, 1 la rue, 2 les piétons) du carrefour J ; "feuJP" la force ----------
  function refus(N, e, g) {
    if (e.fin) return "fini";
    const m = /^(feu|plus|moins)(\d)([012])$/.exec(g);
    if (!m || +m[2] >= N.carrefours.length) return "inconnu";
    const f = e.feux[+m[2]], p = +m[3];
    if (m[1] === "plus") return f.cycle[p] < N.cycle.max[p] ? null : "max";
    if (m[1] === "moins") return f.cycle[p] > N.cycle.min[p] ? null : "min";
    if (vert(e, +m[2], p) || f.demande === p) return "deja";
    return null;
  }
  function geste(N, e, g) {
    const r = refus(N, e, g);
    if (r) return r;
    const m = /^(feu|plus|moins)(\d)([012])$/.exec(g), f = e.feux[+m[2]], p = +m[3];
    if (m[1] === "plus") f.cycle[p]++;
    else if (m[1] === "moins") f.cycle[p]--;
    else demander(f, p);
    return null;
  }

  // --- Le temps -------------------------------------------------------------------
  function pas(N, e) {
    if (e.fin) return;
    const c = C(N), K = N.colere, CP = N.compte;
    e.k++;
    let pV = 0, pP = 0, pT = 0;
    e.partis = [];

    // les arrivées
    N.voies.forEach((v, a) => {
      const f = e.voies[a];
      while (e.nes[a] < c.arr[a].length && c.arr[a][e.nes[a]] <= e.k) {
        const der = f.length ? f[f.length - 1] : null;
        f.push({ id: e.nes[a], q: der ? Math.min(0, der.q - c.GAP) : 0, s: 0, arret: 0, compte: false });
        e.nes[a]++;
      }
    });
    N.trams.forEach((h, i) => { const tr = e.trams[i]; if (tr.etat === "avant" && e.k >= pasDe(h.heure)) { tr.etat = "route"; tr.q = 0; } });
    while (e.nesP < c.arrP.length && c.arrP[e.nesP] <= e.k) {
      const id = e.nesP++, o = coinDe(N, id);
      e.feux[o.j].attente[o.k].push({ id, arret: 0 });
    }

    // les feux de chaque carrefour : le cycle automatique, puis l'orange et le dégagement
    e.feux.forEach((f, j) => {
      f.t++;
      if (f.etat === "vert" && f.demande == null && f.t >= pasDe(f.cycle[f.phase])) {
        const q = suivante(f, f.phase);
        if (q != null) demander(f, q);
      }
      if (f.etat === "orange" && f.t >= c.ORANGE) { f.etat = "rouge"; f.t = 0; }
      if (f.etat === "rouge" && f.t >= c.DEG && degage(N, e, j, f.phase)) { f.phase = f.demande; f.demande = null; f.etat = "vert"; f.t = 0; f.changements++; }
    });

    // les voitures, voie par voie, de la tête à la queue
    N.voies.forEach((voie, a) => {
      const f = e.voies[a], A = voie.arrets, dernier = A[A.length - 1];
      const entre = A.map(() => 0);           // les voitures devant, entre l'arrêt i et le suivant
      let lead = null, partie = false;
      for (const x of f) {
        let v = x.q + c.V, franchit = false;
        if (x.s < A.length) {
          const s = A[x.s];
          if (x.q <= s.L && v > s.L) {
            if (vert(e, s.carrefour, voie.axe) && e.k - e.franchi[a][x.s] >= c.DEBIT && entre[x.s] < c.places[a][x.s]) franchit = true;
            else v = s.L;
          }
        }
        if (lead) v = Math.min(v, lead.q - c.GAP);
        if (v > x.q) {
          x.q = v;
          if (franchit && x.q > A[x.s].L) { e.franchi[a][x.s] = e.k; x.s++; x.arret = 0; }
        } else {
          x.arret++;
          if (x.arret > c.PV) {
            x.parti = true; partie = true; pV += K.voiture; e.renonces[a]++; e.partis.push({ voie: a, q: x.q, id: x.id });
            continue;
          }
        }
        if (x.s > 0 && x.s < A.length) entre[x.s - 1]++;
        if (!x.compte && x.s === A.length && x.q - c.LEN >= dernier.L + dernier.B) { x.compte = true; e.passes += CP.voiture; e.detail.voitures += CP.voiture; }
        lead = x;
      }
      if (partie) e.voies[a] = f.filter(x => !x.parti);
      const g = e.voies[a];
      while (g.length && g[0].q >= voie.fin + c.LEN) g.shift();
    });
    // les trams
    N.trams.forEach((h, i) => {
      const tr = e.trams[i];
      if (tr.etat !== "route") return;
      const voie = N.voies[voieTram(N, h.sens)], s = voie.arrets[0];
      let v = tr.q + c.V;
      if (tr.q <= s.L && v > s.L && !vert(e, s.carrefour, 1)) v = s.L;
      if (v > tr.q) tr.q = v; else { tr.arret++; if (tr.arret > c.PT) pT += K.tram * PAS; }
      if (!tr.compte && tr.q - c.LTRAM >= s.L + s.B) { tr.compte = true; e.passes += CP.tram; e.detail.tram += CP.tram; }
      if (tr.q >= voie.fin + c.LTRAM) tr.etat = "fini";
    });
    // les piétons, carrefour par carrefour
    e.feux.forEach((f, j) => {
      if (vert(e, j, 2)) for (const coin of f.attente) { while (coin.length) { const p = coin.shift(); f.traversent.push({ id: p.id, reste: c.PIET }); } }
      for (const p of f.traversent) p.reste--;
      while (f.traversent.length && f.traversent[0].reste <= 0) { f.traversent.shift(); e.finisP++; e.passes += CP.pieton; e.detail.pietons += CP.pieton; }
      f.attente.forEach((coin, k) => {
        for (const p of coin) p.arret++;
        while (coin.length && coin[0].arret > c.PP) { const p = coin.shift(); pP += K.pieton; e.renoncesP++; e.partis.push({ carrefour: j, coin: k, id: p.id }); }
      });
    });

    // l'humeur, et la fin
    e.humeur -= pV + pP + pT;
    e.perte.voitures += pV; e.perte.pietons += pP; e.perte.tram += pT;
    if (e.humeur <= 1e-9) { e.humeur = 0; e.fin = { fin: "colere", passes: e.passes }; return; }
    if (e.k >= c.FIN) e.fin = { fin: e.passes >= N.quota ? "gagne" : "rate", passes: e.passes };
  }
  const points = e => e.passes + Math.round(e.humeur);
  function etoiles(N, e) {
    if (!e.fin || e.fin.fin !== "gagne") return 0;
    const n = points(e);
    return n >= N.etoiles.trois ? 3 : n >= N.etoiles.deux ? 2 : 1;
  }

  return { PAS, pasDe, heure, C, voieTram, coinDe, charger, copie, zoneOccupee, degage, vert, suivante, refus, geste, pas, points, etoiles };
})();
</script>

<script id="vue">
"use strict";
(function () {
  // --- La vue : elle dessine l'état du moteur et lui passe les gestes. Aucune
  // règle ici : les feux, les files, les piétons et le quota sont au moteur.
  const N = JSON.parse(document.getElementById("niveaux").textContent).niveaux[0];
  const E = Carrefours, c = E.C(N);
  const $ = id => document.getElementById(id);

  // --- La géométrie (400 × 720) : les cotes des voies sont celles du niveau ------
  const W = 400, H = 720, CX = 200;
  const AV = { x0: 168, x1: 232 };
  const RUES = [{ y0: 180, y1: 244, voies: { AE: 196, AO: 228 } }, { y0: 470, y1: 558, voies: { BE: 484, BO: 544 }, rails: { BE: 506, BO: 522 } }];
  const XN = 184, XS = 216;
  // l'avant d'un mobile sur la voie a, à la position q → x, y, angle
  function surVoie(a, q, rail) {
    const id = N.voies[a].id;
    if (id === "N") return { x: XN, y: q, ang: Math.PI / 2 };
    if (id === "S") return { x: XS, y: H - q, ang: -Math.PI / 2 };
    const R = RUES[id[0] === "A" ? 0 : 1], y = rail ? R.rails[id] : R.voies[id];
    return id[1] === "O" ? { x: q, y, ang: 0 } : { x: W - q, y, ang: Math.PI };
  }
  // les coins de chaque carrefour : NO, NE, SE, SO
  const COINS = RUES.map(R => [{ x: 148, y: R.y0 - 22 }, { x: 252, y: R.y0 - 22 }, { x: 252, y: R.y1 + 22 }, { x: 148, y: R.y1 + 22 }]);

  // --- La partie ------------------------------------------------------------------
  let e, acc = 0, vitesse = 1, enMarche = false, avant = null, t = 0, finVue = false, pffs = [], vaguePrec = null, quotaVu = false;
  function nouvelle() {
    e = E.charger(N); acc = 0; enMarche = false; finVue = false; pffs = []; quotaVu = false; vaguePrec = null;
    accueil(); majBandeau(); majReglages();
  }

  // --- Le dessin ---------------------------------------------------------------------
  const toile = $("toile"), ctx = toile.getContext("2d");
  let ech = 1, ox = 0, oy = 0;
  function cadrer() {
    const r = toile.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 3);
    toile.width = Math.max(1, Math.round(r.width * dpr)); toile.height = Math.max(1, Math.round(r.height * dpr));
    ech = Math.min(toile.width / W, toile.height / H);
    ox = (toile.width - W * ech) / 2; oy = (toile.height - H * ech) / 2;
  }
  function rrect(x, y, w, h, r) {
    ctx.beginPath(); ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  function rond(x, y, r, coul) { ctx.fillStyle = coul; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
  const COUL = {
    pave: "#efe0c2", route: "#8f8a80", trottoir: "#e2cfa8", ligne: "#f4ecd8",
    rail: "#5c574f", traverse: "#7a6a58", toits: ["#d9774b", "#c8643c", "#e08b5a", "#b85a3a", "#d06a44"],
    ombre: "rgba(70,40,15,.18)", feuille: "#5fa33c", feuilleC: "#7cbf4f", encre: "#3b2414", creme: "#fff3dc",
    vert: "#3fc25a", orange: "#ffae2b", rouge: "#e8452f", eteint: "#4a3a30"
  };
  // les toits : trois bandes de pâtés de maisons, de part et d'autre de l'avenue
  const BANDES = [[0, 156], [270, 444], [584, 720]];
  const TOITS = [];
  BANDES.forEach(([y0, y1], b) => {
    for (const [x0, x1] of [[4, 150], [250, 396]]) {
      let y = y0 + 6, i = 0;
      while (y < y1 - 30) {
        const h = Math.min(y1 - 6 - y, 44 + ((b * 7 + i * 5 + x0) % 3) * 12);
        const w1 = 60 + ((i * 3 + b) % 3) * 10;
        TOITS.push([x0, y, w1, h], [x0 + w1 + 6, y, x1 - x0 - w1 - 6, h]);
        y += h + 8; i++;
      }
    }
  });
  const ARBRES = [[150 - 8, 300, 10], [252 + 8, 420, 10], [150 - 8, 610, 11], [252 + 8, 300, 9]];

  function decor(xMin, xMax, yMin, yMax) {
    ctx.fillStyle = COUL.pave; ctx.fillRect(xMin - 10, yMin - 10, xMax - xMin + 20, yMax - yMin + 20);
    ctx.fillStyle = COUL.trottoir;
    ctx.fillRect(AV.x0 - 12, yMin - 10, AV.x1 - AV.x0 + 24, yMax - yMin + 20);
    for (const R of RUES) ctx.fillRect(xMin - 10, R.y0 - 12, xMax - xMin + 20, R.y1 - R.y0 + 24);
    ctx.fillStyle = COUL.route;
    ctx.fillRect(AV.x0, yMin - 10, AV.x1 - AV.x0, yMax - yMin + 20);
    for (const R of RUES) ctx.fillRect(xMin - 10, R.y0, xMax - xMin + 20, R.y1 - R.y0);
    // les rails du tram, dans la rue de la Gare
    for (const y of Object.values(RUES[1].rails)) {
      ctx.fillStyle = COUL.traverse;
      for (let x = Math.floor((xMin - 10) / 12) * 12; x < xMax + 10; x += 12) ctx.fillRect(x, y - 7, 4, 14);
      ctx.fillStyle = COUL.rail; ctx.fillRect(xMin - 10, y - 5, xMax - xMin + 20, 2); ctx.fillRect(xMin - 10, y + 3, xMax - xMin + 20, 2);
    }
    // l'axe de l'avenue, entre les carrefours
    ctx.strokeStyle = COUL.ligne; ctx.lineWidth = 2; ctx.setLineDash([12, 10]);
    ctx.beginPath();
    ctx.moveTo(CX, yMin - 10); ctx.lineTo(CX, RUES[0].y0 - 22);
    ctx.moveTo(CX, RUES[0].y1 + 22); ctx.lineTo(CX, RUES[1].y0 - 22);
    ctx.moveTo(CX, RUES[1].y1 + 22); ctx.lineTo(CX, yMax + 10);
    ctx.stroke(); ctx.setLineDash([]);
    // les passages piétons et les lignes d'arrêt de chaque carrefour
    for (const R of RUES) {
      ctx.fillStyle = "rgba(255,255,255,.85)";
      for (let k = 0; k < 6; k++) { const x = AV.x0 + 3 + k * 10.6; ctx.fillRect(x, R.y0 - 20, 6, 18); ctx.fillRect(x, R.y1 + 2, 6, 18); }
      const n = Math.floor((R.y1 - R.y0) / 10.8);
      for (let k = 0; k < n; k++) { const y = R.y0 + 3 + k * 10.8; ctx.fillRect(148, y, 18, 6); ctx.fillRect(234, y, 18, 6); }
      ctx.fillStyle = "#fff";
      ctx.fillRect(AV.x0, R.y0 - 24, CX - AV.x0, 3); ctx.fillRect(CX, R.y1 + 21, AV.x1 - CX, 3);
      ctx.fillRect(142, (R.y0 + R.y1) / 2, 3, (R.y1 - R.y0) / 2); ctx.fillRect(255, R.y0, 3, (R.y1 - R.y0) / 2);
    }
    // les toits et les arbres
    TOITS.forEach(([x, y, w, h], i) => {
      if (w < 20 || h < 20) return;
      ctx.fillStyle = COUL.ombre; rrect(x + 3, y + 4, w, h, 6); ctx.fill();
      ctx.fillStyle = COUL.toits[i % COUL.toits.length]; rrect(x, y, w, h, 6); ctx.fill();
      ctx.strokeStyle = "rgba(90,35,15,.35)"; ctx.lineWidth = 2;
      ctx.beginPath(); if (w > h) { ctx.moveTo(x + 6, y + h / 2); ctx.lineTo(x + w - 6, y + h / 2); } else { ctx.moveTo(x + w / 2, y + 6); ctx.lineTo(x + w / 2, y + h - 6); } ctx.stroke();
    });
    for (const [x, y, r] of ARBRES) { rond(x + 3, y + 4, r, COUL.ombre); rond(x, y, r, COUL.feuille); rond(x - r * 0.25, y - r * 0.25, r * 0.6, COUL.feuilleC); }
    // le nom de chaque carrefour, sur une plaque à l'angle
    N.carrefours.forEach((C0, j) => {
      const R = RUES[j], x = 300, y = R.y0 - 34;
      ctx.font = "13px 'Lilita One', sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
      const w = ctx.measureText(C0.nom).width + 18;
      ctx.fillStyle = "rgba(42,36,32,.25)"; rrect(x - w / 2 + 2, y - 10, w, 22, 6); ctx.fill();
      ctx.fillStyle = "#2f6fa8"; rrect(x - w / 2, y - 12, w, 22, 6); ctx.fill();
      ctx.fillStyle = "#fff"; ctx.fillText(C0.nom, x, y);
    });
  }

  function voiture(x, y, ang, id) {
    const coul = ["#f2b705", "#4caf3e", "#8a4fc8", "#ef8a1c", "#fff3dc", "#2bb3a0", "#e0533d", "#3f7fd0"][(id * 5) % 8];
    ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
    ctx.fillStyle = "rgba(30,20,10,.25)"; rrect(-c.LEN + 2, -6, c.LEN, 14, 4); ctx.fill();
    ctx.fillStyle = coul; rrect(-c.LEN, -7.5, c.LEN, 15, 4); ctx.fill();
    ctx.fillStyle = "rgba(40,60,80,.55)"; rrect(-c.LEN + 13, -6, 5, 12, 2); ctx.fill(); rrect(-c.LEN + 3, -6, 4, 12, 2); ctx.fill();
    ctx.restore();
  }
  function tram(x, y, ang) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
    ctx.fillStyle = "rgba(30,20,10,.25)"; rrect(-c.LTRAM + 2, -8, c.LTRAM, 18, 6); ctx.fill();
    ctx.fillStyle = "#2f9e58"; rrect(-c.LTRAM, -9, c.LTRAM, 18, 6); ctx.fill();
    ctx.fillStyle = "#ffe9a8"; rrect(-c.LTRAM + 3, -6, c.LTRAM - 6, 12, 4); ctx.fill();
    ctx.fillStyle = "#2f9e58"; for (let k = 1; k < 4; k++) ctx.fillRect(-c.LTRAM + k * c.LTRAM / 4, -9, 3, 18);
    ctx.restore();
  }
  function pieton(x, y, id, fache) {
    const coul = ["#3f7fd0", "#e0533d", "#8a4fc8", "#2bb3a0", "#ef8a1c"][id % 5];
    rond(x + 1, y + 2, 5, "rgba(30,20,10,.2)"); rond(x, y, 5, coul); rond(x, y - 1, 2.8, fache ? "#e86a4a" : "#f2c79b");
  }
  function bulle(x, y, texte, coul) {
    ctx.font = "12px 'Lilita One', sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    const w = ctx.measureText(texte).width + 12;
    ctx.fillStyle = "#fff"; rrect(x - w / 2, y - 9, w, 18, 9); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x - 4, y + 8); ctx.lineTo(x, y + 14); ctx.lineTo(x + 3, y + 8); ctx.fill();
    ctx.fillStyle = coul; ctx.fillText(texte, x, y + 0.5);
  }
  function badge(x, y, texte, fache) {
    ctx.font = "14px 'Lilita One', sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    const w = ctx.measureText(texte).width + 16;
    ctx.fillStyle = fache ? "#e0533d" : COUL.encre; rrect(x - w / 2, y - 12, w, 24, 12); ctx.fill();
    ctx.fillStyle = "#fff"; ctx.fillText(texte, x, y + 1);
  }
  // la couleur d'une phase d'un carrefour : vert, orange (on la quitte), rouge
  const teinte = (j, p) => { const f = e.feux[j]; return f.phase === p ? (f.etat === "vert" ? "vert" : f.etat === "orange" ? "orange" : "rouge") : "rouge"; };
  // les feux au bord de chaque ligne d'arrêt
  function feuxAuSol() {
    N.voies.forEach((v, a) => v.arrets.forEach(s => {
      const p = surVoie(a, s.L), dx = -Math.sin(p.ang) * 16, dy = Math.cos(p.ang) * 16;
      const x = p.x + dx, y = p.y + dy;
      rrect(x - 6, y - 6, 12, 12, 3); ctx.fillStyle = "#2a2420"; ctx.fill();
      rond(x, y, 4, COUL[teinte(s.carrefour, v.axe)]);
    }));
    // le bonhomme des piétons, à deux coins de chaque carrefour
    N.carrefours.forEach((C0, j) => {
      const k = teinte(j, 2), allume = k === "vert" || (k === "orange" && (t * 4) % 1 < 0.5);
      for (const C1 of [COINS[j][1], COINS[j][3]]) {
        const x = C1.x + (C1.x > CX ? 16 : -16), y = C1.y;
        rrect(x - 6, y - 8, 12, 16, 3); ctx.fillStyle = "#2a2420"; ctx.fill();
        rond(x, y - 3, 3, allume ? COUL.vert : COUL.eteint); rond(x, y + 3, 3, allume ? COUL.eteint : COUL.rouge);
      }
    });
  }

  function dessiner() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = COUL.pave; ctx.fillRect(0, 0, toile.width, toile.height);
    ctx.setTransform(ech, 0, 0, ech, ox, oy);
    const xMin = -ox / ech, xMax = (toile.width - ox) / ech, yMin = -oy / ech, yMax = (toile.height - oy) / ech;
    decor(xMin, xMax, yMin, yMax);
    feuxAuSol();
    const bulles = [];
    N.voies.forEach((v, a) => {
      let hors = 0, horsFache = false;
      for (const x of e.voies[a]) {
        const p = surVoie(a, x.q), fache = x.arret > c.PV * 0.6;
        if (p.x < xMin - 10 || p.x > xMax + 10 || p.y < yMin - 10 || p.y > yMax + 10) { hors++; horsFache = horsFache || fache; continue; }
        voiture(p.x, p.y, p.ang, x.id * 6 + a);
        if (fache && x.id % 3 === 0 && ((t + x.id * 0.53 + a) % 2.6) < 0.8) bulles.push([p.x, p.y - 16, "Pouet !", COUL.encre]);
      }
      if (hors) {
        const id = v.id, y = surVoie(a, 0).y;
        const pos = id === "N" ? [XN, yMin + 18] : id === "S" ? [XS, yMax - 18] : id[1] === "O" ? [xMin + 20, y] : [xMax - 20, y];
        badge(pos[0], pos[1], "+" + hors, horsFache);
      }
    });
    N.trams.forEach((h, i) => {
      const tr = e.trams[i];
      if (tr.etat !== "route") return;
      const p = surVoie(E.voieTram(N, h.sens), tr.q, true);
      tram(p.x, p.y, p.ang);
      if (tr.arret > c.PT && (t % 1.6) < 0.8) bulles.push([p.x - Math.cos(p.ang) * 40, p.y - 22, "Ding ding !", "#2f9e58"]);
    });
    e.feux.forEach((f, j) => {
      f.attente.forEach((coin, k) => coin.forEach((p, r) => {
        const C0 = COINS[j][k], col = r % 4, lig = Math.floor(r / 4), sx = k === 0 || k === 3 ? -1 : 1, sy = k < 2 ? -1 : 1;
        pieton(C0.x + sx * (col * 9), C0.y + sy * (lig * 9), p.id, p.arret > c.PP * 0.6);
      }));
      for (const p of f.traversent) {
        const k = E.coinDe(N, p.id).k, u = 1 - p.reste / c.PIET, de = COINS[j][k];
        const vers = COINS[j][p.id % 2 ? (k + 1) % 4 : (k + 3) % 4];
        pieton(de.x + (vers.x - de.x) * u, de.y + (vers.y - de.y) * u, p.id, false);
      }
    });
    for (const pf of pffs) if (t - pf.t < 1.4) bulles.push([pf.x, pf.y - 14 - (t - pf.t) * 12, pf.texte, "#e0533d"]);
    for (const b of bulles) bulle(...b);
  }

  // --- Le bandeau et le panneau ------------------------------------------------------
  function majBandeau() {
    const n = e.passes, hum = Math.round(Math.max(0, e.humeur)), max = N.etoiles.trois * 1.04;
    $("v-passes").textContent = n + " / " + N.quota;
    $("v-remplie").style.width = Math.min(100, 100 * n / max).toFixed(1) + "%";
    // la première étoile est au quota ; les deux autres se comptent en points
    // (passés + humeur) : leur cran recule quand l'humeur baisse
    const seuils = [N.quota, Math.max(N.quota, N.etoiles.deux - hum), Math.max(N.quota, N.etoiles.trois - hum)], groupes = [];
    for (const x of seuils) { const g = groupes.find(g => Math.abs(g.s - x) < 4); if (g) g.n++; else groupes.push({ s: x, n: 1 }); }
    const crans = groupes.map(g => `<i class="${n >= g.s ? "" : "eteinte"}" style="left:${Math.min(97, 100 * g.s / max).toFixed(1)}%">${"★".repeat(g.n)}</i>`).join("");
    const barre = $("v-barre"); if (barre.dataset.crans !== crans) { barre.querySelectorAll("i").forEach(x => x.remove()); barre.insertAdjacentHTML("beforeend", crans); barre.dataset.crans = crans; }
    const h = Math.max(0, e.humeur) / 100;
    $("v-humeur").style.width = (100 * h).toFixed(1) + "%";
    $("v-humeur").style.background = h > 0.6 ? "#4caf3e" : h > 0.3 ? "#ffc93c" : "#e0533d";
    $("v-humeur-r").setAttribute("aria-valuenow", Math.round(e.humeur));
    $("v-visage").setAttribute("fill", h > 0.6 ? "#ffc93c" : h > 0.3 ? "#f2a13a" : "#e86a4a");
    $("v-bouche").setAttribute("d", h > 0.6 ? "M10 20 Q16 25 22 20" : h > 0.3 ? "M10 21 L22 21" : "M10 23 Q16 17 22 23");
    const tt = E.heure(e), min = Math.min(60, Math.floor(tt / N.duree * 60));
    $("v-heure").textContent = (min >= 60 ? "18:00" : "17:" + String(min).padStart(2, "0"));
    const puces = [];
    N.trams.forEach((x, i) => { if (e.trams[i].etat === "avant" && x.heure - tt <= 30) puces.push({ t: x.heure, html: `<span class="puce tram">tram ${x.sens ? "←" : "→"} · ${Math.max(0, Math.ceil(x.heure - tt))} s</span>` }); });
    N.vagues.forEach(v => {
      if (!v.nom) return;
      if (v.de > tt && v.de - tt <= 20) puces.push({ t: v.de, html: `<span class="puce vague">${v.nom.replace(/^la /, "")} · ${Math.ceil(v.de - tt)} s</span>` });
      else if (v.de <= tt && tt < v.a) puces.push({ t: -1, html: `<span class="puce vague">${v.nom.replace(/^la /, "")} !</span>` });
    });
    puces.sort((a, b) => a.t - b.t);
    const html = puces.slice(0, 4).map(p => p.html).join("") || `<span class="puce vide">Rien d'annoncé pour l'instant</span>`;
    if ($("horaire").innerHTML !== html) $("horaire").innerHTML = html;
  }
  const PHASES = ["Avenue", "Rue", "Piétons"];
  // le panneau : un carton par carrefour, une rangée par phase (la lampe force
  // la phase ; − et + règlent son vert)
  function construireReglages() {
    $("reglages").innerHTML = N.carrefours.map((C0, j) => `<div class="panneau"><h3>${C0.nom}</h3>${PHASES.map((nom, p) => `
      <div class="rang">
        <button class="lampe" data-g="feu${j}${p}" aria-label="Forcer ${nom} au vert"><i id="l${j}${p}"></i><span>${nom}</span></button>
        <button class="pm" data-g="moins${j}${p}" id="m${j}${p}" aria-label="Raccourcir">−</button>
        <b id="d${j}${p}"></b>
        <button class="pm" data-g="plus${j}${p}" id="p${j}${p}" aria-label="Allonger">+</button>
        <span class="reste" id="r${j}${p}"></span>
      </div>`).join("")}</div>`).join("");
    $("reglages").querySelectorAll("[data-g]").forEach(b => b.addEventListener("click", () => agir(b.dataset.g)));
  }
  function majReglages() {
    e.feux.forEach((f, j) => PHASES.forEach((nom, p) => {
      const k = teinte(j, p), d = f.cycle[p];
      const coul = k === "vert" ? "var(--feu-vert)" : k === "orange" ? "var(--feu-orange)" : "var(--feu-rouge)";
      const l = $("l" + j + p); if (l.style.background !== coul) l.style.background = coul;
      const txt = d + " s"; if ($("d" + j + p).textContent !== txt) $("d" + j + p).textContent = txt;
      $("m" + j + p).disabled = !!E.refus(N, e, "moins" + j + p) && !e.fin;
      $("p" + j + p).disabled = !!E.refus(N, e, "plus" + j + p) && !e.fin;
      const reste = k === "vert" && d ? Math.max(0, 1 - f.t * E.PAS / d) : 0;
      $("r" + j + p).style.width = (reste * 100).toFixed(1) + "%";
    }));
  }

  // --- Les gestes ------------------------------------------------------------------
  function agir(g) {
    if (e.fin) return;
    if (!enMarche) partir();
    E.geste(N, e, g);
    majReglages();
  }
  let minuterie = null;
  function dire(texte, duree = 2600) {
    const m = $("message"); m.textContent = texte; m.hidden = false;
    clearTimeout(minuterie); minuterie = setTimeout(() => { m.hidden = true; }, duree);
  }

  // --- L'accueil et la fin -----------------------------------------------------------
  function accueil() {
    $("carte").innerHTML = `<h2>${N.titre}</h2>
      <p><b>Fais passer ${N.quota} personnes avant 18 h.</b></p>
      <ul class="regle">
        <li>Deux carrefours, et leurs feux tournent <b>tout seuls</b> : l'avenue, puis la rue, puis les piétons. Dans le panneau du bas, règle la durée de chaque vert avec <b>−</b> et <b>+</b>.</li>
        <li>Les voitures de l'avenue traversent les deux carrefours. Entre eux, il n'y a de la place que pour quelques voitures : un rouge trop long en bas bloque le haut.</li>
        <li>Quand une heure de pointe arrive, réajuste. Touche une lampe pour forcer une phase tout de suite.</li>
        <li>Une voiture compte 1, un piéton 1, le <b>tram</b> ${N.compte.tram}. Qui attend trop à un feu fait demi-tour et l'humeur baisse ; les étoiles ajoutent l'humeur qui reste à 18 h.</li>
      </ul>
      <button id="b-partir">C'est parti</button>`;
    $("carte").hidden = false;
    $("b-partir").addEventListener("click", partir);
  }
  function partir() { enMarche = true; avant = null; $("carte").hidden = true; }
  function finir() {
    const f = e.fin, P = e.perte, D = e.detail, l = [];
    const moins = x => Math.round(x) ? "−" + Math.round(x) : "0";
    if (f.fin === "gagne") {
      const n = E.etoiles(N, e);
      l.push(`<h2>Objectif atteint !</h2>`, `<div class="etoiles">${"★".repeat(n)}<span class="eteinte">${"★".repeat(3 - n)}</span></div>`);
      l.push(`<p><b>${f.passes}</b> passés + <b>${Math.round(e.humeur)}</b> d'humeur = <b>${E.points(e)} points</b>. Deux étoiles à ${N.etoiles.deux}, trois à ${N.etoiles.trois} ; le meilleur réglage du banc fait ${N.par}.</p>`);
    } else if (f.fin === "rate") {
      l.push(`<h2>Quota manqué</h2>`, `<p><b>${f.passes}</b> personnes passées sur ${N.quota}. Des verts trop courts font perdre du temps à chaque orange ; un tronçon plein bloque le carrefour d'avant.</p>`);
    } else {
      const pire = Object.entries(P).sort((a, b) => b[1] - a[1])[0][0];
      l.push(`<h2>Le quartier est en colère !</h2>`);
      l.push(`<p>${{ voitures: "Trop de voitures ont fait demi-tour. Regarde où les files s'allongent, et donne-leur plus de vert.",
        pietons: "Les piétons ont trop attendu aux coins. Ne saute pas leur phase trop longtemps.",
        tram: "Le tram a trop attendu : donne la rue de la Gare à temps." }[pire]}</p>`);
    }
    const demi = e.renonces.reduce((a, b) => a + b, 0);
    l.push(`<ul><li>Passés : voitures ${D.voitures} · piétons ${D.pietons} · tram ${D.tram}</li><li>Partis : ${demi} voiture${demi > 1 ? "s" : ""} · ${e.renoncesP} piéton${e.renoncesP > 1 ? "s" : ""}</li><li>Humeur : voitures ${moins(P.voitures)}, piétons ${moins(P.pietons)}, tram ${moins(P.tram)}</li></ul>`);
    l.push(`<button id="b-rejouer">Rejouer</button>`);
    $("carte").innerHTML = l.join("");
    $("carte").hidden = false;
    $("message").hidden = true;
    $("b-rejouer").addEventListener("click", nouvelle);
  }

  // --- La boucle ------------------------------------------------------------------------
  function unPas() {
    E.pas(N, e);
    for (const x of e.partis) {
      const p = x.voie != null ? surVoie(x.voie, x.q) : COINS[x.carrefour][x.coin];
      pffs.push({ x: p.x, y: p.y, t, texte: x.voie != null ? "Pfff !" : "Tant pis !" });
    }
    pffs = pffs.filter(pf => t - pf.t < 1.4);
    const tt = E.heure(e), v = N.vagues.find(v => v.nom && v.de <= tt && tt < v.a);
    if (v && v !== vaguePrec) dire(v.nom[0].toUpperCase() + v.nom.slice(1) + " !");
    vaguePrec = v || null;
    if (!quotaVu && e.passes >= N.quota) { quotaVu = true; dire("Quota atteint ! Continue pour les étoiles."); }
  }
  function image(ms) {
    if (avant == null) avant = ms;
    const dt = Math.min(0.1, (ms - avant) / 1000);
    avant = ms;
    if (enMarche && !e.fin) {
      acc += dt * vitesse; t += dt * vitesse;
      while (acc >= E.PAS && !e.fin) { unPas(); acc -= E.PAS; }
    } else t += dt * 0.25;
    dessiner(); majBandeau(); majReglages();
    if (e.fin && !finVue) { finVue = true; setTimeout(finir, 900); }
    requestAnimationFrame(image);
  }

  $("b-recommencer").addEventListener("click", nouvelle);
  $("b-vitesse").addEventListener("click", () => { vitesse = vitesse === 1 ? 2 : vitesse === 2 ? 3 : 1; $("b-vitesse").textContent = "×" + vitesse; });
  $("b-pause").addEventListener("click", () => {
    if (e.fin) return;
    if (enMarche) { enMarche = false; dire("Pause", 100000); }
    else { partir(); $("message").hidden = true; }
  });
  addEventListener("resize", cadrer);
  new ResizeObserver(cadrer).observe($("scene"));
  // pour les vérifications sans les doigts
  window.carrefours = { etat: () => e, agir, avancer(n) { if (!enMarche) partir(); for (let i = 0; i < n && !e.fin; i++) { unPas(); t += E.PAS; } } };
  construireReglages();
  nouvelle();
  cadrer();
  (document.fonts && document.fonts.load ? document.fonts.load("16px 'Lilita One'") : Promise.resolve()).finally(() => requestAnimationFrame(image));
})();
</script>
</body>
</html>
