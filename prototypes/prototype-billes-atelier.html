<title>L'atelier à billes</title>
<style>
/* ------------------------------------------------------------------
   L'ATELIER À BILLES — deuxième prototype de « Billes », avec son éditeur.

   Décidé avec Vincent le 16 octobre 2026 : avant d'inventer d'autres
   mécanismes, un ÉDITEUR. On choisit la taille de la grille (jusqu'à
   12 × 24), on pose tous les modules qu'il faut pour construire la solution,
   puis on en retire quelques-uns : ceux-là, le joueur devra les poser.
   C'est le moyen de juger, au doigt, si c'est amusant.

   Le moteur change de nature par rapport à prototype-billes.html (gardé
   comme trace) : la bille a de l'ÉLAN, un entier, et les modules sont ceux
   de la liste de Vincent (rampes, rampe plate, accélérateur, courbes,
   poche, tremplin, ascenseur, bascule). Les règles sont dans le bloc
   « moteur », joué aussi par tools/billes-atelier-banc.mjs.

   Le style suit la charte trouvée en mockups (tools/PROMPT-billes-mockups.md,
   « La charte retenue ») : fond violet uni, modules ivoire, l'or comme seul
   accent, les couleurs réservées aux billes et à leurs godets, aucune grille
   visible en jeu. Un seul thème, sombre, par choix.
   ------------------------------------------------------------------ */
:root {
  color-scheme: dark;
  --fond: #3a2a86;
  --fond-haut: #4a38a4;
  --fond-creux: #2a1d66;
  --ivoire: #f3ead7;
  --ivoire-ombre: #c9b994;
  --ivoire-terne: #b9ad93;
  --or: #e6b04a;
  --or-sombre: #a8761f;
  --texte: #ffffff;
  --texte-doux: #cfc6f2;
  --vert: #3fb54a;
  --vert-sombre: #23802d;
  --rouge-msg: #ff9c9c;
  --vert-msg: #a6f0a0;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--fond); color: var(--texte); }
body { font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; -webkit-user-select: none; user-select: none; }
#app { max-width: 560px; margin: 0 auto; padding: max(10px, env(safe-area-inset-top)) 16px max(14px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 10px; }
button, select, input { font: inherit; color: inherit; }
.barre { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.modes { display: flex; background: var(--fond-creux); border-radius: 999px; padding: 3px; }
.modes button { border: 0; background: none; padding: 7px 14px; border-radius: 999px; font-weight: 700; color: var(--texte-doux); }
.modes button[aria-pressed="true"] { background: var(--ivoire); color: var(--fond); }
#choix { flex: 1; min-width: 0; height: 38px; border-radius: 12px; border: 2px solid var(--or); background: var(--fond-creux); padding: 0 10px; }
.carte { background: var(--ivoire); color: #3a2a86; border-radius: 16px; padding: 8px 12px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.carte b { font-weight: 800; }
#file { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
#message { min-height: 2.8em; color: var(--texte-doux); }
#message.succes { color: var(--vert-msg); } #message.danger { color: var(--rouge-msg); }
#plateau { width: 100%; height: auto; display: block; touch-action: none; }
#jeu-bas { display: flex; gap: 8px; align-items: stretch; }
#bac { flex: 1; display: flex; gap: 8px; overflow-x: auto; min-width: 0; padding: 4px 2px; }
.piece { position: relative; flex: 0 0 68px; height: 76px; border-radius: 14px; background: var(--ivoire); color: #3a2a86; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; touch-action: none; border: 0; padding: 4px 2px; text-align: center; line-height: 1.1; }
.piece.vide { background: #9b93bf; color: #5c5490; }
.piece .badge { position: absolute; top: -6px; right: -6px; min-width: 22px; height: 22px; border-radius: 11px; background: var(--or); color: #3a2a86; font-size: 12px; display: flex; align-items: center; justify-content: center; border: 2px solid var(--fond); }
.piece.choisi { outline: 3px solid var(--or); outline-offset: 2px; }
#lacher { flex: 0 0 96px; border-radius: 18px; border: 3px solid var(--or); background: var(--vert); font-weight: 800; font-size: 18px; color: #fff; box-shadow: inset 0 -5px 0 var(--vert-sombre); }
.rond { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--or); background: var(--fond-creux); font-size: 18px; }
.rond[aria-pressed="true"] { background: var(--or); color: var(--fond); }
#edition, #edition-haut { display: flex; flex-direction: column; gap: 10px; }
.champ { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--texte-doux); }
.champ input, .champ select { width: 64px; height: 34px; border-radius: 10px; border: 1px solid var(--or-sombre); background: var(--fond-creux); padding: 0 8px; }
.champ input#nom { width: 160px; }
.bouton { height: 38px; border-radius: 12px; border: 2px solid var(--or); background: var(--fond-creux); padding: 0 12px; font-weight: 700; }
.bouton.plein { background: var(--or); color: #3a2a86; }
.petit { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--fond-creux); padding: 0; }
#json { width: 100%; min-height: 110px; border-radius: 12px; border: 1px solid var(--or-sombre); background: var(--fond-creux); color: var(--texte); font: 12px/1.35 ui-monospace, Menlo, monospace; padding: 8px; -webkit-user-select: text; user-select: text; }
#fantome { position: fixed; left: 0; top: 0; pointer-events: none; display: none; z-index: 10; }
[hidden] { display: none !important; }
.aide-edit { font-size: 13px; color: var(--texte-doux); }
</style>

<script id="moteur">
"use strict";
// ------------------------------------------------------------------
// LE MOTEUR DE L'ATELIER — sans DOM, joué tel quel par
// tools/billes-atelier-banc.mjs.
//
// La grille a L colonnes (x, de gauche à droite) et H rangées (y, du haut).
// Les billes tombent une à une de l'entonnoir, au-dessus de la colonne
// `entree`, et doivent finir dans le godet de leur couleur, sous la grille.
//
// L'ÉLAN — un entier de 0 à ELAN_MAX, la seule « physique » du jeu :
//   descendre d'une case (tout droit ou en biais) donne 1 d'élan ;
//   rouler d'une case à plat en coûte 1 ; sans élan, la bille S'ARRÊTE ;
//   l'accélérateur en donne ELAN_ACCEL ; le saut du tremplin en coûte
//   ELAN_SAUT ; l'ascenseur porte la bille sans en dépenser et la pose
//   avec 1 d'élan.
// La bille garde aussi son SENS (gauche, droite, ou aucun s'il n'a jamais
// été dévié) : c'est lui qui la fait rouler sur une rampe plate.
//
// LES MODULES — un par case ; d = 0 : vers la gauche, 1 : vers la droite :
//   rampe      rampe à 45° : la bille repart en biais vers le bas, côté d ;
//   plat       rampe horizontale : la bille la traverse dans son sens, si
//              elle a de l'élan ; sinon (ou sans sens) elle s'arrête ;
//   accel      accélérateur : +ELAN_ACCEL, et la bille part à plat côté d ;
//   courbe45   courbe de 45° : une bille qui TOMBE repart en biais côté d,
//              une bille qui arrive en biais ou à plat repart à plat ;
//   courbe90   courbe de 90° : la bille repart à plat côté d, sans perte ;
//   poche      vide, elle avale la première bille qui y entre ; pleine,
//              elle se comporte comme une rampe plate : on passe dessus ;
//   tremplin   la bille part côté d ; avec au moins ELAN_SAUT d'élan, elle
//              saute la case voisine et retombe deux cases plus loin ;
//   ascenseur  monte la bille jusqu'au sommet de la pile d'ascenseurs, puis
//              la pose sur la case voisine (côté d du module du sommet), une
//              rangée au-dessus : une unité = un niveau de plus ;
//   bascule    la bille repart en biais vers le bas, du côté où penche la
//              bascule, puis la bascule penche de l'autre côté.
// Case vide : la bille tombe tout droit. Sous la dernière rangée : le godet
// de sa colonne (« - » = un trou). Hors de la grille, arrêtée, ou qui tourne
// en rond (plus de PAS_MAX pas) : la bille est perdue.
//
// LES BILLES : R rouge, B bleue, J jaune, V verte, et G grise, la bille de
// LEST : elle n'a pas de godet, elle sert à remplir les poches. Une bille de
// couleur réussit dans le godet de sa couleur, et nulle part ailleurs. Une
// bille grise réussit partout, sauf dans un godet de couleur, arrêtée ou
// tournant en rond.
// ------------------------------------------------------------------
const ELAN_MAX = 4, ELAN_ACCEL = 2, ELAN_SAUT = 2;
const LARGEUR_MAX = 12, HAUTEUR_MAX = 24;
const MODULES = {
  rampe:     { nom: "Rampe",        oriente: true },
  plat:      { nom: "Rampe plate",  oriente: false },
  accel:     { nom: "Accélérateur", oriente: true },
  courbe45:  { nom: "Courbe 45°",   oriente: true },
  courbe90:  { nom: "Courbe 90°",   oriente: true },
  poche:     { nom: "Poche",        oriente: false },
  tremplin:  { nom: "Tremplin",     oriente: true },
  ascenseur: { nom: "Ascenseur",    oriente: true },
  bascule:   { nom: "Bascule",      oriente: true },
};
const COULEURS = ["R", "B", "J", "V", "G"];
const cle = (x, y) => x + "," + y;

// Les modules d'un niveau, en table « x,y » → { t, d, fixe }.
function grille(niv, modules) {
  const g = new Map();
  for (const m of modules || niv.modules) g.set(cle(m.x, m.y), { t: m.t, d: m.d || 0, fixe: !!m.fixe });
  return g;
}

// Une partie : lacher(couleur) rend le trajet de la bille, pas à pas :
// { c, pts: [{ x, y, v, ev? }], fin: godet|trou|hors|poche|arret|boucle, col?, ok }
// ev : « bascule » (elle a basculé), « saut », « avale » (la poche se remplit),
// « monte » (ascenseur).
function Machine(niv, modules) {
  const L = niv.largeur, H = niv.hauteur, PAS_MAX = L * H * 8;
  const s = new Map();
  for (const [k, m] of grille(niv, modules)) s.set(k, { ...m, plein: null });
  let ok = true;
  function lacher(c) {
    let x = niv.entree, y = -1, sens = 0, v = 0, mv = { dx: 0, dy: 1 };
    const pts = [{ x, y, v }];
    const fin = (quoi, extra) => {
      const t = { c, pts, fin: quoi, ...extra };
      t.ok = c === "G" ? !(quoi === "godet" && niv.godets[t.col] !== "-") && quoi !== "arret" && quoi !== "boucle"
                       : quoi === "godet" && niv.godets[t.col] === c;
      if (!t.ok) ok = false;
      return t;
    };
    for (let n = 0; n < PAS_MAX; n++) {
      // le déplacement, et ce qu'il coûte ou rapporte
      if (mv.saut) v -= ELAN_SAUT;
      else if (mv.dy > 0) v = Math.min(ELAN_MAX, v + 1);
      else if (mv.dy === 0) { if (v <= 0) return fin("arret"); v -= 1; }
      if (mv.dx) sens = Math.sign(mv.dx);
      const nx = x + mv.dx, ny = y + mv.dy;
      if (nx < 0 || nx >= L || ny < 0) { pts.push({ x: nx, y: Math.max(ny, y), v, ev: mv.saut ? "saut" : undefined }); return fin("hors"); }
      if (ny >= H) { pts.push({ x: nx, y: H, v }); return fin(niv.godets[nx] === "-" ? "trou" : "godet", { col: nx }); }
      x = nx; y = ny;
      const pt = { x, y, v };
      if (mv.saut) pt.ev = "saut";
      pts.push(pt);
      const arrivee = mv.dy > 0 ? (mv.dx ? "biais" : "chute") : "plat";
      const m = s.get(cle(x, y));
      if (!m) { mv = { dx: 0, dy: 1 }; continue; }
      const cote = m.d ? 1 : -1;
      switch (m.t) {
        case "rampe": mv = { dx: cote, dy: 1 }; break;
        case "bascule": mv = { dx: cote, dy: 1 }; m.d ^= 1; pt.ev = "bascule"; break;
        case "courbe90": mv = { dx: cote, dy: 0 }; break;
        case "courbe45": mv = arrivee === "chute" ? { dx: cote, dy: 1 } : { dx: cote, dy: 0 }; break;
        case "accel": v = Math.min(ELAN_MAX, v + ELAN_ACCEL); mv = { dx: cote, dy: 0 }; break;
        case "tremplin": mv = v >= ELAN_SAUT ? { dx: 2 * cote, dy: 0, saut: true } : { dx: cote, dy: 0 }; break;
        case "poche":
          if (m.plein === null) { m.plein = c; pt.ev = "avale"; return fin("poche"); }
          // pleine : une rampe plate
        // falls through
        case "plat":
          if (!sens) return fin("arret");
          mv = { dx: sens, dy: 0 }; break;
        case "ascenseur": {
          let haut = y;
          while (s.get(cle(x, haut - 1))?.t === "ascenseur") { haut--; pts.push({ x, y: haut, v, ev: "monte" }); }
          y = haut;
          // posée sur la case voisine, une rangée au-dessus, avec 1 d'élan
          // (un pas vers le haut ne coûte ni ne rapporte rien)
          const sommet = s.get(cle(x, haut));
          mv = { dx: sommet.d ? 1 : -1, dy: -1 };
          v = 1;
          break;
        }
      }
    }
    return fin("boucle");
  }
  return { s, get ok() { return ok; }, lacher };
}

// Ce qui rend un niveau injouable, avant même de le jouer (liste vide : rien).
function defauts(niv) {
  const e = [], L = niv.largeur, H = niv.hauteur;
  if (!Number.isInteger(L) || L < 2 || L > LARGEUR_MAX) e.push(`largeur ${L} : de 2 à ${LARGEUR_MAX}`);
  if (!Number.isInteger(H) || H < 2 || H > HAUTEUR_MAX) e.push(`hauteur ${H} : de 2 à ${HAUTEUR_MAX}`);
  if (e.length) return e;
  if (!Number.isInteger(niv.entree) || niv.entree < 0 || niv.entree >= L) e.push(`entrée hors de la grille`);
  if (typeof niv.godets !== "string" || niv.godets.length !== L || /[^RBJV-]/.test(niv.godets)) e.push(`godets : ${L} caractères parmi R, B, J, V, -`);
  if (typeof niv.file !== "string" || !niv.file.length || /[^RBJVG]/.test(niv.file)) e.push(`file : au moins une bille parmi R, B, J, V, G`);
  else for (const c of new Set(niv.file.replace(/G/g, ""))) if (!niv.godets.includes(c)) e.push(`aucun godet pour la bille ${c}`);
  const vues = new Set();
  for (const q of niv.modules || []) {
    if (!MODULES[q.t]) { e.push(`module inconnu : ${q.t}`); continue; }
    if (!(q.x >= 0 && q.x < L && q.y >= 0 && q.y < H)) e.push(`${q.t} hors de la grille (${q.x},${q.y})`);
    if (q.d !== undefined && q.d !== 0 && q.d !== 1) e.push(`${q.t} (${q.x},${q.y}) : d vaut 0 ou 1`);
    if (vues.has(cle(q.x, q.y))) e.push(`deux modules en (${q.x},${q.y})`);
    vues.add(cle(q.x, q.y));
  }
  return e;
}

// Une partie entière, d'un coup.
function jouer(niv, modules) {
  const m = Machine(niv, modules), trajets = [];
  for (const c of niv.file) { const t = m.lacher(c); trajets.push(t); if (!t.ok) return { ok: false, trajets }; }
  return { ok: true, trajets };
}
</script>

<script id="vue">
"use strict";
const DEMOS = JSON.parse(document.getElementById("niveaux-json").textContent).niveaux;

function arrivee(j) {
  const a = anim, p = a.t.pts[j];
  if (p.ev === "bascule") { aff.get(p.x + "," + p.y).d ^= 1; ton(1400, .03, "square", .05); dessin(); }
  else if (p.ev === "saut") ton(1046, .12, "sine", .1);
  if (aff.get(p.x + "," + p.y) && p.ev !== "avale") note(p.x, p.y);
  if (j < a.P.length - 1) return;
  // fin du trajet
  anim = null; attente = .3;
  const t = a.t;
  el("polyline", { points: a.P.map(q => q.join(",")).join(" "), fill: "none", stroke: COUL[t.c], "stroke-opacity": .22, "stroke-width": 4 }, gTraces);
  if (t.fin === "poche") { a.e.remove(); aff.get(p.x + "," + p.y).plein = t.c; ton(330, .18, "sine", .2); ton(220, .2, "sine", .1, .05); dessin(); }
  else if (t.fin === "godet" || t.fin === "trou") {
    const n = cupN[t.col]++; placer(a, X(t.col) - 9 + (n % 3) * 9, TOP + niv.hauteur * C + 30 - Math.floor(n / 3) * 9);
    if (t.ok) { const f = { R: 523.25, B: 659.25, J: 783.99, V: 587.33, G: 440 }[t.c]; ton(f, .3, "triangle", .16); ton(f * 1.5, .4, "triangle", .1, .08); }
  } else a.e.setAttribute("opacity", .35);
  if (!t.ok) rate(t);
}
function rate(t) {
  phase = "fin"; ton(110, .5, "sawtooth", .1);
  dire(`Raté : la bille ${NOM[t.c]} n° ${idx + 1} ${RAISON[t.fin]}.` + (mode === "jouer" ? " Touche « Réessayer »." : ""), "danger");
  $("lacher").textContent = "Réessayer";
}
function gagne() {
  phase = "fin";
  [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => ton(f, .5, "triangle", .14, i * .1));
  if (mode === "jouer") dire(`Réussi en ${essais} essai${essais > 1 ? "s" : ""} !`, "succes");
  else dire("La solution réussit : toutes les billes sont rangées.", "succes");
  $("lacher").textContent = "Rejouer";
  dessin();
}
function tic(dt) {
  if (phase !== "run") return;
  if (!anim) { if ((attente -= dt) <= 0) suivante(); return; }
  const a = anim, p = a.t.pts[a.j + 1];
  a.u += dt / (p.ev === "saut" ? .42 : .3 - .045 * Math.min(p.v, ELAN_MAX));
  if (a.u >= 1) { a.j++; a.u = 0; placer(a, a.P[a.j][0], a.P[a.j][1]); arrivee(a.j); return; }
  const [x1, y1] = a.P[a.j], [x2, y2] = a.P[a.j + 1];
  placer(a, x1 + (x2 - x1) * a.u, y1 + (y2 - y1) * a.u - (p.ev === "saut" ? Math.sin(Math.PI * a.u) * 26 : 0));
}
let avant = 0;
function boucle(ts) { const dt = Math.min(.05, (ts - avant) / 1000 || 0); avant = ts; tic(dt); requestAnimationFrame(boucle); }

// --- les niveaux ---------------------------------------------------------------
function remplirChoix() {
  const s = $("choix"); s.innerHTML = "";
  const g1 = document.createElement("optgroup"); g1.label = "Démonstrations";
  DEMOS.forEach((n, i) => g1.appendChild(new Option(n.nom, "d:" + i))); s.appendChild(g1);
  const noms = Object.keys(mesNiveaux).sort();
  if (noms.length) { const g2 = document.createElement("optgroup"); g2.label = "Mes niveaux"; noms.forEach(n => g2.appendChild(new Option(n, "m:" + n))); s.appendChild(g2); }
  if (source === "brouillon") s.appendChild(new Option("(brouillon non enregistré)", "brouillon"));
  s.value = source;
}
function charger(src) {
  source = src;
  if (src.startsWith("d:")) niv = copie(DEMOS[+src.slice(2)]);
  else if (src.startsWith("m:")) niv = copie(mesNiveaux[src.slice(2)]);
  poses = new Map(); essais = 0; remplirChoix(); preparer();
}
function preparer() {
  phase = "prep"; anim = null; idx = -1; gBilles.innerHTML = ""; gTraces.innerHTML = "";
  $("lacher").textContent = "Lâcher";
  dessinFond();
  if (mode === "editer") { majEditeur(); dire("Construis la solution, puis marque les pièces que le joueur devra poser."); }
  else { dessin(); dire(niv.modules.some(q => !q.fixe) ? "Pose les pièces, puis lâche les billes." : "Lâche les billes."); }
}
function changerMode(nouveau) {
  mode = nouveau;
  $("m-jouer").setAttribute("aria-pressed", mode === "jouer"); $("m-editer").setAttribute("aria-pressed", mode === "editer");
  $("jeu").hidden = mode !== "jouer"; $("jeu-outils").hidden = mode !== "jouer"; $("edition").hidden = mode !== "editer"; $("edition-haut").hidden = mode !== "editer";
  poses = new Map(); essais = 0; preparer();
  if (mode === "editer") majOutils();
}

// --- les commandes ---------------------------------------------------------------
$("m-jouer").onclick = () => changerMode("jouer");
$("m-editer").onclick = () => changerMode("editer");
$("choix").onchange = e => charger(e.target.value);
$("lacher").onclick = lancer;
$("recommencer").onclick = () => { reveilSon(); poses = new Map(); preparer(); };
$("essayer").onclick = lancer;
$("vers-jeu").onclick = () => changerMode("jouer");
$("sens").onclick = () => { sens ^= 1; majOutils(); };
$("t-gomme").onclick = () => { outil = outil === "gomme" ? "rampe" : "gomme"; majOutils(); };
$("t-poser").onclick = () => { outil = outil === "poser" ? "rampe" : "poser"; majOutils(); };
$("larg").onchange = redimensionner; $("haut").onchange = redimensionner;
$("nom").oninput = e => { niv.nom = e.target.value; };
document.querySelectorAll("[data-bille]").forEach(b => b.onclick = () => { if (niv.file.length < 40) niv.file += b.dataset.bille; majEditeur(); });
$("file-moins").onclick = () => { niv.file = niv.file.slice(0, -1); majEditeur(); };
$("enregistrer").onclick = () => {
  const nom = (niv.nom || "").trim();
  if (!nom) return dire("Donne un nom au niveau avant de l'enregistrer.", "danger");
  niv.nom = nom; mesNiveaux[nom] = copie(niv); garder(); source = "m:" + nom; remplirChoix();
  dire(`« ${nom} » est enregistré dans ce navigateur.`, "succes");
};
$("nouveau").onclick = () => {
  niv = { nom: "", largeur: 6, hauteur: 8, entree: 2, godets: "------", file: "R", modules: [] };
  source = "brouillon"; remplirChoix(); preparer();
};
$("supprimer").onclick = () => {
  const nom = niv.nom;
  if (!mesNiveaux[nom]) return dire("Ce niveau n'est pas enregistré : rien à supprimer.", "danger");
  if (!confirmer) { confirmer = true; $("supprimer").textContent = "Confirmer ?"; return; }
  delete mesNiveaux[nom]; garder(); charger("d:0"); dire(`« ${nom} » est supprimé.`);
};
$("exporter").onclick = () => { $("json").value = JSON.stringify(niv); dire("Le niveau est écrit dans le cadre ci-dessous."); };
$("importer").onclick = () => {
  let n; try { n = JSON.parse($("json").value); } catch (e) { return dire("Ce n'est pas du JSON lisible : vérifie le texte collé.", "danger"); }
  n.modules = n.modules || []; const d = defauts(n);
  if (d.length) return dire("Niveau refusé : " + d.join(" ; "), "danger");
  niv = n; source = "brouillon"; remplirChoix(); preparer(); dire("Niveau importé. Enregistre-le pour le garder.", "succes");
};
$("copier").onclick = () => {
  const t = $("json").value || JSON.stringify(niv);
  try { navigator.clipboard.writeText(t).then(() => dire("Copié.", "succes"), () => { $("json").value = t; $("json").select(); dire("Sélectionné : copie-le à la main."); }); }
  catch (e) { $("json").value = t; $("json").select(); }
};
sv.addEventListener("pointerdown", e => {
  if (mode === "editer") { reveilSon(); return toucheEditeur(e); }
  if (phase === "fin") return;
  if (phase !== "prep") return;
  const c = caseSous(versPlateau(e.clientX, e.clientY));
  if (c && poses.has(c.k)) debutGlisse(e, poses.get(c.k).t, poses.get(c.k).d, c.k);
});
document.addEventListener("pointerdown", reveilSon, { once: true });

// Poignée de test : piloter la page sans écran (le temps s'avance à la main).
window.ATELIER = {
  charger, mode: changerMode, lancer,
  poser(x, y, t, d) { poses.set(x + "," + y, { t, d: d || 0 }); dessin(); },
  avancer(sec) { for (let t = 0; t < sec; t += 1 / 30) tic(1 / 30); },
  etat: () => ({ mode, source, phase, message: $("message").textContent, verdict: $("verdict").textContent, niveau: niv }),
};
remplirChoix(); charger("d:0");
requestAnimationFrame(boucle);
</script>
