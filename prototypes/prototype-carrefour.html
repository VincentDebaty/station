<style>
/* ------------------------------------------------------------------
   LE CARREFOUR — prototype (20 octobre 2026), suite du Pontier. Vincent :
   « un carrefour qui s'embouteille, gérer des feux tricolores ; j'aime
   devoir manipuler différentes choses pour fluidifier le trafic ; il faut
   un objectif de réussite ». Un carrefour vu de dessus, trois phases de
   feux (l'avenue, la rue, les piétons) qui tournent TOUTES SEULES : le
   joueur règle la durée de chaque vert (− / +) et la réajuste quand les
   heures de pointe changent (« automatiser un feu et jauger », même jour,
   plus facile quand il y aura plusieurs carrefours). Trois flux (voitures,
   tram à l'horaire, piétons ; l'ambulance a été retirée : elle n'apportait
   rien), et un QUOTA de personnes à faire passer avant 18 h.

   Même charte que Le pontier : plateau vu de dessus, bois et crème,
   Lilita One. Un seul aspect, voulu (pas de thème sombre).
   Le banc : node tools/carrefour-banc.mjs.
   ------------------------------------------------------------------ */
:root {
  color-scheme: light;
  --pave: #efe0c2;
  --bois: #7a4a26;
  --bois-fonce: #5a3418;
  --creme: #fff3dc;
  --encre: #3b2414;
  --or: #ffc93c;
  --ok: #4caf3e;
  --alerte: #e0533d;
  --chiffres: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
  --texte: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden;
  background: var(--bois); color: var(--creme);
  font-family: var(--texte);
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--or); outline-offset: 2px; }
[hidden] { display: none !important; }

#jeu { height: 100%; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); }
.bandeau {
  display: flex; align-items: center; gap: 8px;
  padding: 8px max(16px, env(safe-area-inset-right, 0px)) 4px max(16px, env(safe-area-inset-left, 0px));
}
.objectif {
  display: flex; flex-direction: column; gap: 10px;
  padding: 4px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px));
}
.objectif .ligne { display: flex; gap: 8px; align-items: baseline; font: 400 1.15rem/1 var(--chiffres); font-variant-numeric: tabular-nums; }
.objectif .ligne small { font: 600 11px/1 var(--texte); letter-spacing: .08em; text-transform: uppercase; color: rgba(255, 243, 220, .7); }
.barre { position: relative; height: 16px; border-radius: 999px; background: rgba(0, 0, 0, .3); border: 3px solid var(--bois-fonce); }
.barre > span { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; background: var(--or); }
.barre i { position: absolute; top: -9px; transform: translateX(-50%); font: 400 13px/1 var(--chiffres); font-style: normal; color: var(--or); text-shadow: 0 1px 0 #5a3418; }
.barre i.eteinte { color: rgba(255, 243, 220, .45); }
.humeur { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; }
.humeur svg { width: 30px; height: 30px; flex: none; }
.humeur .mini { flex: 1; min-width: 30px; height: 14px; border-radius: 999px; background: rgba(0, 0, 0, .3); border: 3px solid var(--bois-fonce); overflow: hidden; }
.humeur .mini span { display: block; height: 100%; background: var(--ok); }
.pastille {
  font: 400 1.05rem/1 var(--chiffres); background: var(--bois-fonce); border-radius: 999px;
  padding: 8px 11px; font-variant-numeric: tabular-nums; white-space: nowrap;
}
.rond {
  width: 38px; height: 38px; flex: none; padding: 0; border-radius: 999px;
  border: 3px solid #c9b48c; background: var(--creme); color: var(--encre);
  font: 400 .95rem/1 var(--chiffres); box-shadow: 0 3px 0 #b39a6c;
  display: inline-flex; align-items: center; justify-content: center;
}
.rond:active { transform: translateY(2px); box-shadow: 0 1px 0 #b39a6c; }
.rond svg { width: 17px; height: 17px; }
#horaire {
  display: flex; gap: 6px; overflow: hidden; min-height: 30px;
  padding: 2px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px));
}
.puce {
  flex: none; display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px;
  background: rgba(255, 243, 220, .14); font: 400 .9rem/1 var(--chiffres); white-space: nowrap; font-variant-numeric: tabular-nums;
}
.puce.tram { background: rgba(47, 158, 88, .55); }
.puce.vague { background: rgba(255, 201, 60, .3); }
.puce.vide { background: none; color: rgba(255, 243, 220, .6); font-family: var(--texte); font-size: .85rem; }

.scene { position: relative; flex: 1 1 auto; min-height: 0; background: var(--pave); }
canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.message {
  position: absolute; left: 50%; bottom: max(14px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  max-width: calc(100% - 32px); padding: 8px 14px; border-radius: 999px;
  background: var(--encre); color: var(--creme); font: 400 1rem/1.2 var(--chiffres); text-align: center;
  box-shadow: 0 4px 0 rgba(0, 0, 0, .25);
}
.carte {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: min(23rem, calc(100% - 32px)); max-height: calc(100% - 24px); overflow-y: auto;
  background: var(--bois); color: var(--creme); border: 4px solid var(--bois-fonce); border-radius: 18px;
  padding: 18px 20px 20px; text-align: center;
  box-shadow: 0 8px 0 #4a2a12, 0 14px 30px rgba(30, 15, 5, .35);
}
.carte h2 { margin: 0 0 8px; font: 400 1.8rem/1.1 var(--chiffres); text-wrap: balance; }
.carte p { margin: 0 0 12px; line-height: 1.4; }
.carte .etoiles { font: 400 2.4rem/1 var(--chiffres); color: var(--or); text-shadow: 0 3px 0 #8a5a12; letter-spacing: 4px; margin-bottom: 8px; }
.carte .etoiles .eteinte { color: rgba(255, 243, 220, .3); text-shadow: none; }
.carte ul { list-style: none; margin: 0 0 14px; padding: 0; display: grid; gap: 4px; font: 400 1rem/1.2 var(--chiffres); }
.carte .regle { text-align: left; margin: 0 0 14px; padding-left: 18px; display: block; font: 15px/1.4 var(--texte); }
.carte .regle li { list-style: disc; margin-bottom: 4px; }
.carte button {
  font: 400 1.15rem/1 var(--chiffres); color: #fff; background: var(--ok);
  border: 3px solid #2f7d25; border-radius: 999px; padding: 12px 26px; box-shadow: 0 3px 0 #2f7d25;
}
@media (max-width: 380px) { .pastille { padding: 7px 8px; font-size: .95rem; } .rond { width: 34px; height: 34px; } }
@media (prefers-reduced-motion: reduce) { .rond:active { transform: none; } }
</style>
</head>
<body>

<div id="jeu">
  <header class="bandeau">
    <div class="humeur" title="L'humeur du quartier">
      <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" id="v-visage" fill="#ffc93c" stroke="#5a3418" stroke-width="2.5"/><circle cx="11" cy="13" r="2" fill="#3b2414"/><circle cx="21" cy="13" r="2" fill="#3b2414"/><path id="v-bouche" d="M10 20 Q16 25 22 20" fill="none" stroke="#3b2414" stroke-width="2.5" stroke-linecap="round"/></svg>
      <div class="mini" role="meter" aria-label="Humeur du quartier" aria-valuemin="0" aria-valuemax="100" id="v-humeur-r"><span id="v-humeur"></span></div>

    <span class="pastille" id="v-heure">17:00</span>

    <button class="rond" id="b-pause" aria-label="Pause"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button>
    <button class="rond" id="b-recommencer" aria-label="Recommencer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg></button>
  </header>
  <div class="objectif">
    <div class="ligne"><span id="v-passes">0 / 0</span><small>passés avant 18 h</small></div>
    <div class="barre" id="v-barre"><span id="v-remplie"></span></div>
  </div>
  <div id="horaire" aria-label="Ce qui arrive"></div>
  <main class="scene" id="scene">
    <canvas id="toile" aria-label="Le carrefour : touche un feu pour le passer au vert"></canvas>
    <div class="message" id="message" hidden></div>
    <div class="carte" id="carte"></div>
  </main>
</div>

<!-- ==================================================================
     LE NIVEAU — du JSON pur. Les durées sont en secondes, les longueurs en
     pixels du plateau (400 × 720, vu de dessus) : la vue dessine les voies
     aux mêmes cotes.
       voies      les quatre arrivées : N et S sur l'avenue (axe 0), O et E
                  sur la rue (axe 1) ; approche (du bord à la ligne d'arrêt),
                  traversee (de la ligne d'arrêt au bout du passage piéton
                  d'en face : la zone de conflit), sortie (jusqu'au bord)
       vehicule   vitesse (px/s), ecart (de l'avant d'une voiture à l'avant
                  de la suivante, à l'arrêt), longueur, debit (une voiture
                  au plus franchit la ligne d'arrêt d'une voie toutes les
                  « debit » secondes : le démarrage au vert)
       feux       orange (s) ; degagement (le rouge intégral minimal, après
                  quoi le nouveau vert attend encore que la zone soit vide)
       cycle      le réglage de départ du feu automatique : la durée du vert
                  de l'avenue, de la rue, des piétons (s) ; le joueur la
                  règle en jeu, d'une seconde par geste, entre « min » et
                  « max » (0 pour les piétons : on saute leur phase)
       patience   l'attente qu'on supporte, arrêté. Au-delà, une voiture fait
                  demi-tour et un piéton s'en va : ils ne comptent plus, et
                  l'humeur perd « colere » d'un coup. Le tram, lui, reste et
                  retire « colere » par seconde
       pietons    traversee (s)
       vagues     de, a, et l'intervalle (s) entre deux arrivées sur chaque
                  voie (N, S, O, E) et pour les piétons (P) ; 0 : personne
       trams      l'horaire du tram de la rue : heure, sens (0 : vers l'est,
                  depuis l'ouest ; 1 : vers l'ouest) ; il compte « tram »
                  personnes
       duree      de 17 h à 18 h, en secondes de jeu
       quota      les personnes à faire passer avant 18 h : c'est réussi
       etoiles    comptées en POINTS : les personnes passées plus l'humeur
                  qui reste à 18 h ; une étoile au quota, deux et trois aux
                  seuils « deux » et « trois »
       par        le meilleur score du banc — node tools/carrefour-banc.mjs
                  refuse si le par écrit n'est pas celui qu'il retrouve
     ================================================================== -->
<script type="application/json" id="niveaux">
{
  "niveaux": [
    {
      "id": "1",
      "titre": "Le carrefour des Tilleuls",
      "duree": 180,
      "voies": [

      ],

<script id="moteur">
"use strict";
const Carrefour = (function () {

  // --- Le modèle ---------------------------------------------------------------
  // Un carrefour, trois PHASES : 0 l'avenue au vert, 1 la rue au vert, 2 les
  // piétons. Une seule est verte à la fois (l'enclenchement de Station).
  //
  //   les feux      ils sont AUTOMATIQUES : un cycle avenue → rue → piétons,
  //                 chaque vert dure ce que le joueur a réglé (une phase
  //                 réglée à 0 est sautée). Le joueur JAUGE : il allonge ou
  //                 raccourcit un vert d'une seconde par geste, et peut forcer
  //                 une phase tout de suite. Quitter une phase : l'orange
  //                 (« orange » s), puis le rouge ; la suivante ne passe au
  //                 vert qu'après « degagement » s ET quand la zone de conflit
  //                 est vide (les derniers véhicules, ou les derniers piétons,
  //                 ont fini de traverser). Changer de phase coûte donc du
  //                 temps : un cycle trop court gaspille, un cycle trop long
  //                 fait attendre. Forcer la phase qu'on quitte pendant
  //                 l'orange l'annule.
  //   les voitures  elles arrivent en file sur chacune des quatre voies, à la
  //                 vitesse « vitesse », sans se doubler, et vont tout droit.
  //                 Une voiture ne franchit la ligne d'arrêt qu'au vert de son
  //                 axe, une par voie toutes les « debit » secondes (le
  //                 démarrage) ; engagée, elle va au bout. Arrêtée plus que
  //                 sa patience, elle RENONCE : demi-tour, elle ne comptera
  //                 pas, et l'humeur prend un coup.
  //   le tram       sur ses rails au milieu de la rue, à l'horaire ; il passe
  //                 au vert de la rue et compte « tram » personnes, mais il
  //                 s'énerve vite.
  //   les piétons   ils attendent aux quatre coins et traversent tous ensemble
  //                 pendant la phase des piétons ; trop attendre, ils s'en vont.
  //   la fin        à 18 h (« duree »), gagné si le quota est atteint, raté
  //                 sinon ; perdu avant si l'humeur tombe à zéro. Les étoiles
  //                 se comptent en points : les passés, plus l'humeur qui
  //                 reste — faire passer en énervant tout le monde vaut moins
  //                 qu'un carrefour fluide.
  //
  // Positions en pixels du plateau, temps en pas entiers de PAS secondes :
  // la page et le banc jouent la même partie pour les mêmes gestes.

  const PAS = 0.05;
  const pasDe = s => Math.round(s / PAS);
  const heure = e => e.k * PAS;

  const CACHE = new WeakMap();
  function C(N) {
    let c = CACHE.get(N);
    if (c) return c;
    const V = N.vehicule;
    c = {
      V: Math.round(V.vitesse * PAS), GAP: V.ecart, LEN: V.longueur, LTRAM: V.tram, DEBIT: pasDe(V.debit),
      ORANGE: pasDe(N.feux.orange), DEG: pasDe(N.feux.degagement),
      PV: pasDe(N.patience.voiture), PP: pasDe(N.patience.pieton), PT: pasDe(N.patience.tram),
      PIET: pasDe(N.pietons.traversee), FIN: pasDe(N.duree)
    };
    const ids = N.voies.map(v => v.id);
    const decal = [0, 0.37, 0.61, 0.83];
    c.arr = ids.map((id, a) => {
      const t = [];
      for (const w of N.vagues) { const iv = w[id]; if (iv) for (let x = w.de + decal[a] * iv; x < w.a - 1e-9; x += iv) t.push(pasDe(x)); }
      return t.sort((x, y) => x - y);
    });
    c.arrP = [];
    for (const w of N.vagues) if (w.P) for (let x = w.de + 0.5 * w.P; x < w.a - 1e-9; x += w.P) c.arrP.push(pasDe(x));
    c.arrP.sort((x, y) => x - y);
    CACHE.set(N, c);
    return c;
  }
  // La voie d'arrivée d'un tram : 0 vers l'est vient de l'ouest (voie O), 1 vient de l'est.
  const voieTram = (N, sens) => N.voies.findIndex(v => v.id === (sens === 0 ? "O" : "E"));

  function charger(N) {
    C(N);
    return {
      k: 0, humeur: 100, passes: 0, fin: null,
      phase: 0, etat: "vert", t: 0, demande: null, changements: 0, cycle: N.cycle.depart.slice(),
      voies: N.voies.map(() => []), nes: N.voies.map(() => 0), franchi: N.voies.map(() => -1e9),
      // les trams, un par entrée d'horaire : etat avant, route, fini
      trams: N.trams.map(() => ({ etat: "avant", q: 0, arret: 0 })),
      attente: [[], [], [], []], traversent: [], nesP: 0, finisP: 0,
      perte: { voitures: 0, pietons: 0, tram: 0 }, renonces: N.voies.map(() => 0), renoncesP: 0,
      partis: [],                                              // les renoncements de ce pas (pour la vue)
      detail: { voitures: 0, pietons: 0, tram: 0 }
    };
  }
  const copie = e => JSON.parse(JSON.stringify(e));

  // --- La zone de conflit ---------------------------------------------------------
  const dans = (q, L, B, len) => q > L && q - len < L + B;
  function zoneOccupee(N, e, axe) {
    const c = C(N);
    for (let a = 0; a < N.voies.length; a++) {
      const v = N.voies[a];
      if (v.axe !== axe) continue;
      if (e.voies[a].some(x => dans(x.q, v.approche, v.traversee, c.LEN))) return true;
    }
    if (axe === 1) for (let i = 0; i < N.trams.length; i++) {
      const tr = e.trams[i], v = N.voies[voieTram(N, N.trams[i].sens)];
      if (tr.etat === "route" && dans(tr.q, v.approche, v.traversee, c.LTRAM)) return true;
    }
    return false;
  }
  const degage = (N, e, p) => p === 2 ? e.traversent.length === 0 : !zoneOccupee(N, e, p);
  const vert = (e, p) => e.phase === p && e.etat === "vert";

  // La phase qui suit p dans le cycle (on saute celles réglées à 0) ; null si aucune autre.
  function suivante(e, p) {
    for (let i = 1; i < 3; i++) { const q = (p + i) % 3; if (e.cycle[q] > 0) return q; }
    return null;
  }
  function demander(e, p) {
    if (e.etat === "vert") { e.etat = "orange"; e.t = 0; e.demande = p; }
    else if (e.etat === "orange" && p === e.phase) { e.etat = "vert"; e.demande = null; }
    else e.demande = p;
  }

  // --- Les gestes : "plusP" et "moinsP" règlent le vert de la phase P (0 l'avenue,
  // 1 la rue, 2 les piétons) d'une seconde ; "feuP" la force tout de suite ------
  function refus(N, e, g) {
    if (e.fin) return "fini";
    const m = /^(feu|plus|moins)([012])$/.exec(g);
    if (!m) return "inconnu";
    const p = +m[2];
    if (m[1] === "plus") return e.cycle[p] < N.cycle.max[p] ? null : "max";
    if (m[1] === "moins") return e.cycle[p] > N.cycle.min[p] ? null : "min";
    if (vert(e, p) || e.demande === p) return "deja";
    return null;
  }
  function geste(N, e, g) {
    const r = refus(N, e, g);
    if (r) return r;
    const p = +g[g.length - 1];
    if (g.startsWith("plus")) e.cycle[p]++;
    else if (g.startsWith("moins")) e.cycle[p]--;
    else demander(e, p);
    return null;
  }

  // --- Le temps -------------------------------------------------------------------
  function pas(N, e) {
    if (e.fin) return;
    const c = C(N), K = N.colere, CP = N.compte;
    e.k++;
    let pV = 0, pP = 0, pT = 0;
    e.partis = [];

    // les arrivées
    for (let a = 0; a < N.voies.length; a++) {
      const f = e.voies[a];
      while (e.nes[a] < c.arr[a].length && c.arr[a][e.nes[a]] <= e.k) {
        const der = f.length ? f[f.length - 1] : null;
        f.push({ id: e.nes[a], q: der ? Math.min(0, der.q - c.GAP) : 0, arret: 0, compte: false });
        e.nes[a]++;
      }
    }
    N.trams.forEach((h, i) => { const tr = e.trams[i]; if (tr.etat === "avant" && e.k >= pasDe(h.heure)) { tr.etat = "route"; tr.q = 0; } });
    while (e.nesP < c.arrP.length && c.arrP[e.nesP] <= e.k) {
      const id = e.nesP++;
      e.attente[(id * 3 + 1) % 4].push({ id, arret: 0 });
    }

    // les feux : le cycle automatique, puis l'orange et le dégagement
    e.t++;
    if (e.etat === "vert" && e.demande == null && e.t >= pasDe(e.cycle[e.phase])) {
      const q = suivante(e, e.phase);
      if (q != null) demander(e, q);
    }
    if (e.etat === "orange" && e.t >= c.ORANGE) { e.etat = "rouge"; e.t = 0; }
    if (e.etat === "rouge" && e.t >= c.DEG && degage(N, e, e.phase)) { e.phase = e.demande; e.demande = null; e.etat = "vert"; e.t = 0; e.changements++; }

    // un mobile sur sa voie : il avance jusqu'à la ligne d'arrêt, la franchit au vert de son axe
    const avancer = (m, L, axe, limite, a) => {
      let v = m.q + c.V;
      if (m.q <= L && v > L) {
        if (!vert(e, axe) || (a != null && e.k - e.franchi[a] < c.DEBIT)) v = L;

        }

        lead = x;
      }
      if (partie) e.voies[a] = f.filter(x => !x.parti);
      const g = e.voies[a];
      while (g.length && g[0].q >= fin + c.LEN) g.shift();
    });
    // les trams
    N.trams.forEach((h, i) => {
      const tr = e.trams[i];
      if (tr.etat !== "route") return;
      const voie = N.voies[voieTram(N, h.sens)];
      if (!avancer(tr, voie.approche, 1, null) && tr.arret > c.PT) pT += K.tram * PAS;
      if (!tr.compte && tr.q - c.LTRAM >= voie.approche + voie.traversee) { tr.compte = true; e.passes += CP.tram; e.detail.tram += CP.tram; }
      if (tr.q >= voie.approche + voie.traversee + voie.sortie + c.LTRAM) tr.etat = "fini";
    });

    if (vert(e, 2)) for (const coin of e.attente) { while (coin.length) { const p = coin.shift(); e.traversent.push({ id: p.id, reste: c.PIET }); } }
    for (const p of e.traversent) p.reste--;
    while (e.traversent.length && e.traversent[0].reste <= 0) { e.traversent.shift(); e.finisP++; e.passes += CP.pieton; e.detail.pietons += CP.pieton; }
    e.attente.forEach((coin, k) => {
      for (const p of coin) p.arret++;
      while (coin.length && coin[0].arret > c.PP) { const p = coin.shift(); pP += K.pieton; e.renoncesP++; e.partis.push({ coin: k, id: p.id }); }
    });

    // l'humeur, et la fin
    e.humeur -= pV + pP + pT;
    e.perte.voitures += pV; e.perte.pietons += pP; e.perte.tram += pT;
    if (e.humeur <= 1e-9) { e.humeur = 0; e.fin = { fin: "colere", passes: e.passes }; return; }
    if (e.k >= c.FIN) e.fin = { fin: e.passes >= N.quota ? "gagne" : "rate", passes: e.passes };
  }
  const points = e => e.passes + Math.round(e.humeur);
  function etoiles(N, e) {
    if (!e.fin || e.fin.fin !== "gagne") return 0;
    const n = points(e);
    return n >= N.etoiles.trois ? 3 : n >= N.etoiles.deux ? 2 : 1;
  }

  return { PAS, pasDe, heure, C, voieTram, charger, copie, zoneOccupee, degage, vert, suivante, refus, geste, pas, points, etoiles };
})();
</script>

<script id="vue">

  // --- Le dessin ---------------------------------------------------------------------

  const COUL = {
    pave: "#efe0c2", route: "#8f8a80", routeC: "#9d978c", trottoir: "#e2cfa8", ligne: "#f4ecd8",
    rail: "#5c574f", traverse: "#7a6a58", toits: ["#d9774b", "#c8643c", "#e08b5a", "#b85a3a", "#d06a44"],
    ombre: "rgba(70,40,15,.18)", feuille: "#5fa33c", feuilleC: "#7cbf4f", encre: "#3b2414", creme: "#fff3dc",
    vert: "#3fc25a", orange: "#ffae2b", rouge: "#e8452f", eteint: "#4a3a30"

  const ARBRES = [[20, 296, 12], [130, 292, 10], [372, 452, 12], [20, 452, 11], [130, 630, 12], [272, 640, 12]]
    .filter(([x, y, r]) => !FEUX.some(F => Math.abs(x - F.x) < 66 + r && y + r > F.y - 50 && y - r < F.y + REGLE + 22));
  function decor(xMin, xMax, yMin, yMax) {
    ctx.fillStyle = COUL.pave; ctx.fillRect(xMin - 10, yMin - 10, xMax - xMin + 20, yMax - yMin + 20);

    ctx.fillRect(AV.x0, yMin - 10, AV.x1 - AV.x0, yMax - yMin + 20);
    ctx.fillRect(xMin - 10, RU.y0, xMax - xMin + 20, RU.y1 - RU.y0);
    // les rails du tram, dans la rue
    for (const y of [YTO, YTE]) {
      ctx.fillStyle = COUL.traverse;
      for (let x = Math.floor((xMin - 10) / 12) * 12; x < xMax + 10; x += 12) ctx.fillRect(x, y - 7, 4, 14);
      ctx.fillStyle = COUL.rail; ctx.fillRect(xMin - 10, y - 5, xMax - xMin + 20, 2); ctx.fillRect(xMin - 10, y + 3, xMax - xMin + 20, 2);
    }
    // les lignes au sol : axe de l'avenue, bords de la rue
    ctx.strokeStyle = COUL.ligne; ctx.lineWidth = 2; ctx.setLineDash([12, 10]);
    ctx.beginPath(); ctx.moveTo(CX, yMin - 10); ctx.lineTo(CX, RU.y0 - 22); ctx.moveTo(CX, RU.y1 + 22); ctx.lineTo(CX, yMax + 10); ctx.stroke();
    ctx.setLineDash([]);
    // les passages piétons et les lignes d'arrêt
    ctx.fillStyle = "rgba(255,255,255,.85)";
    for (let k = 0; k < 6; k++) {
      const x = AV.x0 + 3 + k * 10.6;
      ctx.fillRect(x, 316, 6, 18); ctx.fillRect(x, 426, 6, 18);

    for (let k = 0; k < 8; k++) {
      const y = RU.y0 + 3 + k * 10.8;

    ctx.fillStyle = "#fff";
    ctx.fillRect(AV.x0, 310, CX - AV.x0, 3); ctx.fillRect(CX, 447, AV.x1 - CX, 3);
    ctx.fillRect(142, CY + 10, 3, RU.y1 - CY - 10); ctx.fillRect(255, RU.y0, 3, CY - 10 - RU.y0);

    TOUTES.forEach(([x, y, w, h], i) => {
      ctx.fillStyle = COUL.ombre; rrect(x + 3, y + 4, w, h, 6); ctx.fill();
      ctx.fillStyle = COUL.toits[i % COUL.toits.length]; rrect(x, y, w, h, 6); ctx.fill();
      ctx.strokeStyle = "rgba(90,35,15,.35)"; ctx.lineWidth = 2;
      ctx.beginPath(); if (w > h) { ctx.moveTo(x + 6, y + h / 2); ctx.lineTo(x + w - 6, y + h / 2); } else { ctx.moveTo(x + w / 2, y + 6); ctx.lineTo(x + w / 2, y + h - 6); } ctx.stroke();
    });

    }

  function voiture(x, y, ang, id, fache) {
    const coul = ["#f2b705", "#4caf3e", "#8a4fc8", "#ef8a1c", "#fff3dc", "#2bb3a0", "#e0533d", "#3f7fd0"][(id * 5) % 8];
    ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
    ctx.fillStyle = "rgba(30,20,10,.25)"; rrect(-c.LEN + 2, -6, c.LEN, 14, 4); ctx.fill();
    ctx.fillStyle = coul; rrect(-c.LEN, -7.5, c.LEN, 15, 4); ctx.fill();
    ctx.fillStyle = "rgba(40,60,80,.55)"; rrect(-c.LEN + 13, -6, 5, 12, 2); ctx.fill(); rrect(-c.LEN + 3, -6, 4, 12, 2); ctx.fill();

  function tram(x, y, ang, fache) {

    ctx.fillStyle = "#ffe9a8"; rrect(-c.LTRAM + 3, -6, c.LTRAM - 6, 12, 4); ctx.fill();

  }
  function bulle(x, y, texte, coul) {
    ctx.font = "12px 'Lilita One', sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    const w = ctx.measureText(texte).width + 12;
    ctx.fillStyle = "#fff"; rrect(x - w / 2, y - 9, w, 18, 9); ctx.fill();

    ctx.fillStyle = coul; ctx.fillText(texte, x, y + 0.5);

    const w = ctx.measureText(texte).width + 16;
    ctx.fillStyle = fache ? "#e0533d" : COUL.encre; rrect(x - w / 2, y - 12, w, 24, 12); ctx.fill();
    ctx.fillStyle = "#fff"; ctx.fillText(texte, x, y + 1);
  }

  const teinte = p => e.phase === p ? (e.etat === "vert" ? "vert" : e.etat === "orange" ? "orange" : "rouge") : "rouge";
  // les petits feux au bord de chaque ligne d'arrêt, pour lire le carrefour d'un coup d'œil
  function petitsFeux() {
    const pos = { N: [AV.x0 - 8, 306], S: [AV.x1 + 8, 454], O: [138, RU.y1 + 8], E: [262, RU.y0 - 8] };
    N.voies.forEach(v => {
      const [x, y] = pos[v.id], k = teinte(v.axe);
      rrect(x - 5, y - 5, 10, 10, 3); ctx.fillStyle = "#2a2420"; ctx.fill();
      rond(x, y, 3.2, COUL[k]);
    });
  }
  function dessinerFeu(p) {
    const F = FEUX[p], k = teinte(p), dem = e.demande === p;
    const sec = secousse[p] && t - secousse[p] < 0.35 ? Math.sin((t - secousse[p]) * 60) * 4 : 0;
    ctx.save(); ctx.translate(F.x + sec, F.y);
    if (dem) { ctx.strokeStyle = (t * 3) % 1 < 0.5 ? "#ffc93c" : "rgba(255,201,60,.35)"; ctx.lineWidth = 4; rrect(-30, -50, 60, 100, 16); ctx.stroke(); }
    ctx.fillStyle = "rgba(30,20,10,.3)"; rrect(-22, -40, 48, 84, 12); ctx.fill();
    ctx.fillStyle = "#2a2420"; rrect(-24, -44, 48, 84, 12); ctx.fill();

      rond(0, -2, 10, k === "orange" ? COUL.orange : COUL.eteint);
      rond(0, 23, 10, k === "vert" ? COUL.vert : COUL.eteint);

    } else {

    ctx.fillStyle = COUL.encre; ctx.fillText(F.nom, F.x, F.y + 60);
    // le réglage : − 6 s +

    ctx.strokeStyle = "#c9b48c"; ctx.lineWidth = 2.5; ctx.stroke();
    for (const [dx, signe, g] of [[-34, "−", "moins"], [34, "+", "plus"]]) {
      const actif = !E.refus(N, e, g + p) || e.fin;

      ctx.fillStyle = "#fff"; ctx.font = "20px 'Lilita One', sans-serif"; ctx.fillText(signe, F.x + dx, y + 1);
    }
    ctx.fillStyle = COUL.encre; ctx.font = "17px 'Lilita One', sans-serif";
    ctx.fillText(e.cycle[p] ? e.cycle[p] + " s" : "sauté", F.x, y + 1);
    // les piétons qui attendent : leur nombre au-dessus du bouton
    if (p === 2) { const n = e.attente.reduce((s, x) => s + x.length, 0); if (n) badge(F.x + 30, F.y - 46, String(n), e.attente.some(x => x.some(q => q.arret > c.PP * 0.6))); }
  }

  function dessiner() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = COUL.pave; ctx.fillRect(0, 0, toile.width, toile.height);

    decor(xMin, xMax, yMin, yMax);
    petitsFeux();
    const bulles = [];
    // les voitures, et les files qui sortent du champ
    N.voies.forEach((v, a) => {
      let hors = 0, horsFache = false;
      for (const x of e.voies[a]) {
        const p = surVoie(a, x.q), fache = x.arret > c.PV * 0.6;
        if (p.x < xMin - 10 || p.x > xMax + 10 || p.y < yMin - 10 || p.y > yMax + 10) { hors++; horsFache = horsFache || fache; continue; }
        voiture(p.x, p.y, p.ang, x.id * 4 + a, fache);
        if (fache && x.id % 3 === 0 && ((t + x.id * 0.53 + a) % 2.6) < 0.8) bulles.push([p.x, p.y - 16, "Pouet !", COUL.encre]);
      }

        badge(pos[0], pos[1], "+" + hors, horsFache);

    });
    N.trams.forEach((h, i) => {

    // les piétons : aux coins, puis sur les passages
    e.attente.forEach((coin, k) => coin.forEach((p, r) => {

    }));

      pieton(de.x + (vers.x - de.x) * u, de.y + (vers.y - de.y) * u, p.id, false);
    }
    for (const pf of pffs) if (t - pf.t < 1.4) bulles.push([pf.x, pf.y - 14 - (t - pf.t) * 12, pf.texte, "#e0533d"]);

  }

  // --- Le bandeau -------------------------------------------------------------------
  // La barre compte les passés. La première étoile est au quota ; les deux
  // autres se comptent en points (passés + humeur) : leur cran recule quand
  // l'humeur baisse.
  function majBandeau() {
    const n = e.passes, hum = Math.round(Math.max(0, e.humeur)), max = N.etoiles.trois * 1.04;
    $("v-passes").textContent = n + " / " + N.quota;
    $("v-remplie").style.width = Math.min(100, 100 * n / max).toFixed(1) + "%";
    // les crans qui tombent au même endroit (au quota, quand l'humeur est haute) se regroupent
    const seuils = [N.quota, Math.max(N.quota, N.etoiles.deux - hum), Math.max(N.quota, N.etoiles.trois - hum)], groupes = [];
    for (const x of seuils) { const g = groupes.find(g => Math.abs(g.s - x) < 4); if (g) g.n++; else groupes.push({ s: x, n: 1 }); }
    const crans = groupes.map(g => `<i class="${n >= g.s ? "" : "eteinte"}" style="left:${Math.min(97, 100 * g.s / max).toFixed(1)}%">${"★".repeat(g.n)}</i>`).join("");
    const barre = $("v-barre"); if (barre.dataset.crans !== crans) { barre.querySelectorAll("i").forEach(x => x.remove()); barre.insertAdjacentHTML("beforeend", crans); barre.dataset.crans = crans; }
    const h = Math.max(0, e.humeur) / 100;
    $("v-humeur").style.width = (100 * h).toFixed(1) + "%";
    $("v-humeur").style.background = h > 0.6 ? "#4caf3e" : h > 0.3 ? "#ffc93c" : "#e0533d";
    $("v-humeur-r").setAttribute("aria-valuenow", Math.round(e.humeur));
    $("v-visage").setAttribute("fill", h > 0.6 ? "#ffc93c" : h > 0.3 ? "#f2a13a" : "#e86a4a");
    $("v-bouche").setAttribute("d", h > 0.6 ? "M10 20 Q16 25 22 20" : h > 0.3 ? "M10 21 L22 21" : "M10 23 Q16 17 22 23");
    const tt = E.heure(e), min = Math.min(60, Math.floor(tt / N.duree * 60));
    $("v-heure").textContent = (min >= 60 ? "18:00" : "17:" + String(min).padStart(2, "0"));
    const puces = [];
    N.trams.forEach((x, i) => { if (e.trams[i].etat === "avant" && x.heure - tt <= 30) puces.push({ t: x.heure, html: `<span class="puce tram">tram ${x.sens ? "←" : "→"} · ${Math.max(0, Math.ceil(x.heure - tt))} s</span>` }); });
    N.vagues.forEach(v => {
      if (!v.nom) return;
      if (v.de > tt && v.de - tt <= 20) puces.push({ t: v.de, html: `<span class="puce vague">${v.nom.replace(/^la /, "")} · ${Math.ceil(v.de - tt)} s</span>` });
      else if (v.de <= tt && tt < v.a) puces.push({ t: -1, html: `<span class="puce vague">${v.nom.replace(/^la /, "")} !</span>` });
    });
    puces.sort((a, b) => a.t - b.t);
    const html = puces.slice(0, 4).map(p => p.html).join("") || `<span class="puce vide">Rien d'annoncé pour l'instant</span>`;
    if ($("horaire").innerHTML !== html) $("horaire").innerHTML = html;
  }

  // --- Les gestes ------------------------------------------------------------------
  function agir(g) {
    if (e.fin) return;
    if (!enMarche) partir();
    const r = E.geste(N, e, g);
    if (r) secousse[+g[g.length - 1]] = t;
  }
  let minuterie = null;
  function dire(texte, duree = 2600) {
    const m = $("message"); m.textContent = texte; m.hidden = false;
    clearTimeout(minuterie); minuterie = setTimeout(() => { m.hidden = true; }, duree);
  }
  toile.addEventListener("pointerdown", ev => {
    ev.preventDefault();
    if (e.fin) return;
    const r = toile.getBoundingClientRect(), k = toile.width / r.width;
    const x = ((ev.clientX - r.left) * k - ox) / ech, y = ((ev.clientY - r.top) * k - oy) / ech;
    FEUX.forEach((F, p) => {
      const yr = F.y + REGLE;
      if (Math.abs(y - yr) <= 22 && x >= F.x - 58 && x < F.x - 8) agir("moins" + p);
      else if (Math.abs(y - yr) <= 22 && x > F.x + 8 && x <= F.x + 58) agir("plus" + p);
      else if (Math.abs(x - F.x) <= 40 && y >= F.y - 56 && y <= F.y + 62) agir("feu" + p);
    });
  });

  // --- L'accueil et la fin -----------------------------------------------------------
  function accueil() {
    $("carte").innerHTML = `<h2>${N.titre}</h2>
      <p><b>Fais passer ${N.quota} personnes avant 18 h.</b></p>
      <ul class="regle">
        <li>Les feux tournent <b>tout seuls</b> : l'avenue, puis la rue, puis les piétons. Règle la durée de chaque vert avec <b>−</b> et <b>+</b>.</li>
        <li>Chaque changement coûte du temps (l'orange, puis le carrefour doit se vider). Un cycle trop court gaspille, un cycle trop long fait attendre. Quand une heure de pointe arrive, réajuste.</li>
        <li>Touche un feu pour le forcer au vert tout de suite.</li>
        <li>Une voiture compte 1, un piéton 1, le <b>tram</b> ${N.compte.tram}. Qui attend trop <b>fait demi-tour</b> : il ne compte plus, et l'humeur du quartier baisse.</li>
        <li>Les étoiles : l'humeur qui reste à 18 h s'ajoute aux passés.</li>
      </ul>
      <button id="b-partir">C'est parti</button>`;
    $("carte").hidden = false;
    $("b-partir").addEventListener("click", partir);
  }
  function partir() { enMarche = true; avant = null; $("carte").hidden = true; }
  function finir() {
    const f = e.fin, P = e.perte, D = e.detail, l = [];
    const moins = x => Math.round(x) ? "−" + Math.round(x) : "0";
    if (f.fin === "gagne") {
      const n = E.etoiles(N, e);
      l.push(`<h2>Objectif atteint !</h2>`, `<div class="etoiles">${"★".repeat(n)}<span class="eteinte">${"★".repeat(3 - n)}</span></div>`);
      l.push(`<p><b>${f.passes}</b> passés + <b>${Math.round(e.humeur)}</b> d'humeur = <b>${E.points(e)} points</b>. Deux étoiles à ${N.etoiles.deux}, trois à ${N.etoiles.trois} ; le meilleur régulateur du banc fait ${N.par}.</p>`);
    } else if (f.fin === "rate") {
      l.push(`<h2>Quota manqué</h2>`, `<p><b>${f.passes}</b> personnes passées sur ${N.quota}. Des verts trop courts font perdre du temps à chaque orange.</p>`);
    } else {
      const pire = Object.entries(P).sort((a, b) => b[1] - a[1])[0][0];
      l.push(`<h2>Le quartier est en colère !</h2>`);
      l.push(`<p>${{ voitures: "Trop de voitures ont fait demi-tour. Un vert trop long d'un côté fait enrager l'autre ; changer trop souvent aussi.",
        pietons: "Les piétons ont trop attendu aux coins. Ne saute pas leur phase trop longtemps.",
        tram: "Le tram a trop attendu : il compte beaucoup, donne-lui la rue à temps." }[pire]}</p>`);
    }
    const demi = e.renonces.reduce((a, b) => a + b, 0);
    l.push(`<ul><li>Passés : voitures ${D.voitures} · piétons ${D.pietons} · tram ${D.tram}</li><li>Partis : ${demi} voiture${demi > 1 ? "s" : ""} · ${e.renoncesP} piéton${e.renoncesP > 1 ? "s" : ""}</li><li>Humeur : voitures ${moins(P.voitures)}, piétons ${moins(P.pietons)}, tram ${moins(P.tram)}</li></ul>`);
    l.push(`<button id="b-rejouer">Rejouer</button>`);
    $("carte").innerHTML = l.join("");
    $("carte").hidden = false;
    $("message").hidden = true;
    $("b-rejouer").addEventListener("click", nouvelle);
  }

  // --- La boucle ------------------------------------------------------------------------
  let vaguePrec = null, quotaVu = false;
  function unPas() {
    E.pas(N, e);
    for (const x of e.partis) {
      const p = x.voie != null ? surVoie(x.voie, x.q) : COINS[x.coin];
      pffs.push({ x: p.x, y: p.y, t, texte: x.voie != null ? "Pfff !" : "Tant pis !" });
    }
    pffs = pffs.filter(pf => t - pf.t < 1.4);
    const tt = E.heure(e), v = N.vagues.find(v => v.nom && v.de <= tt && tt < v.a);
    if (v && v !== vaguePrec) dire(v.nom[0].toUpperCase() + v.nom.slice(1) + " !");
    vaguePrec = v || null;
    if (!quotaVu && e.passes >= N.quota) { quotaVu = true; dire("Quota atteint ! Continue pour les étoiles."); }
  }
  function image(ms) {
    if (avant == null) avant = ms;
    const dt = Math.min(0.1, (ms - avant) / 1000);
    avant = ms;
    if (enMarche && !e.fin) {
      acc += dt * vitesse; t += dt * vitesse;
      while (acc >= E.PAS && !e.fin) { unPas(); acc -= E.PAS; }
    } else t += dt * 0.25;
    dessiner(); majBandeau();
    if (e.fin && !finVue) { finVue = true; setTimeout(finir, 900); }
    requestAnimationFrame(image);
  }

  $("b-recommencer").addEventListener("click", nouvelle);
  $("b-vitesse").addEventListener("click", () => { vitesse = vitesse === 1 ? 2 : vitesse === 2 ? 3 : 1; $("b-vitesse").textContent = "×" + vitesse; });
  $("b-pause").addEventListener("click", () => {
    if (e.fin) return;
    if (enMarche) { enMarche = false; dire("Pause", 100000); }
    else { partir(); $("message").hidden = true; }
  });
  addEventListener("resize", cadrer);
  new ResizeObserver(cadrer).observe($("scene"));
  // pour les vérifications sans les doigts
  window.carrefour = { etat: () => e, agir, avancer(n) { if (!enMarche) partir(); for (let i = 0; i < n && !e.fin; i++) { unPas(); t += E.PAS; } } };
  nouvelle();
  cadrer();
  (document.fonts && document.fonts.load ? document.fonts.load("16px 'Lilita One'") : Promise.resolve()).finally(() => requestAnimationFrame(image));
})();
</script>
